<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>🧛 뱀파이어 키우기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧛</text></svg>">
<style>
  :root{--bg:#100c18;--panel:#221a33;--panel2:#2c2144;--line:#4a3a6b;--gold:#e8b64c;--text:#ece6f7;--dim:#a99cc4;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;color:var(--text);
            font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
            -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #game{position:fixed;inset:0;display:block;touch-action:none;}
  .hidden{display:none!important;}
  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5;}
  #hud button{pointer-events:auto;}
  #xpbar{position:absolute;top:0;left:0;right:0;height:15px;background:rgba(0,0,0,.65);border-bottom:1px solid var(--line);}
  #xpfill{height:100%;width:0;background:linear-gradient(90deg,#3f8cff,#7fd0ff);transition:width .12s linear;}
  #lvlabel{position:absolute;top:1px;left:8px;font-size:11px;font-weight:900;text-shadow:0 1px 2px #000;color:#fff;}
  #timer{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900;
         letter-spacing:2px;text-shadow:0 2px 6px #000;font-variant-numeric:tabular-nums;}
  #stats{position:absolute;top:28px;right:92px;display:flex;gap:14px;font-size:14px;font-weight:800;text-shadow:0 1px 3px #000;}
  #slots{position:absolute;top:24px;left:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:44vw;}
  .slot{width:30px;height:30px;background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:6px;
        display:flex;align-items:center;justify-content:center;font-size:17px;position:relative;}
  .slot.evo{border-color:var(--gold);box-shadow:0 0 7px rgba(232,182,76,.45);}
  .slot .lv{position:absolute;right:1px;bottom:-1px;font-size:9px;font-weight:900;color:var(--gold);text-shadow:0 1px 2px #000;}
  #bosswrap{position:absolute;top:64px;left:50%;transform:translateX(-50%);width:min(480px,78vw);text-align:center;}
  #bossname{font-size:13px;font-weight:900;color:#ff8484;text-shadow:0 1px 3px #000;margin-bottom:2px;}
  #bossbar{height:10px;background:rgba(0,0,0,.6);border:1px solid #6b2b2b;border-radius:5px;overflow:hidden;}
  #bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff4d4d,#ff9a4d);transition:width .1s linear;}
  #sysbtns{position:absolute;top:24px;right:8px;display:flex;gap:6px;}
  #sysbtns button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:rgba(0,0,0,.5);
                  color:var(--text);font-size:15px;cursor:pointer;}
  #banner{position:absolute;top:32%;left:50%;transform:translateX(-50%);text-align:center;
          font-size:clamp(20px,4.5vw,34px);font-weight:900;color:#ffd76a;
          text-shadow:0 0 16px #000,0 2px 4px #000;opacity:0;transition:opacity .3s;white-space:nowrap;}
  #banner.show{opacity:1;}
  #banner small{display:block;font-size:14px;color:var(--text);font-weight:700;margin-top:4px;}
  #joy{position:absolute;width:110px;height:110px;border:2px solid rgba(255,255,255,.2);border-radius:50%;
       background:rgba(255,255,255,.06);}
  #joyknob{position:absolute;width:46px;height:46px;left:30px;top:30px;border-radius:50%;
           background:rgba(255,255,255,.27);border:1px solid rgba(255,255,255,.4);}
  /* ---------- 오버레이 화면 ---------- */
  #overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .screen{pointer-events:auto;background:linear-gradient(180deg,rgba(36,27,58,.94),rgba(18,12,32,.97));
          border:1px solid var(--line);border-radius:16px;padding:26px 30px;max-width:min(700px,92vw);
          max-height:92vh;overflow:auto;text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.75);}
  h1{margin:0 0 6px;font-size:clamp(24px,5.5vw,38px);letter-spacing:1px;}
  h2{margin:0 0 4px;font-size:22px;}
  .btn{display:inline-block;margin:12px 6px 0;padding:12px 30px;font-size:17px;font-weight:900;color:#1a1226;
       background:linear-gradient(180deg,#ffd97a,#e8b64c);border:none;border-radius:10px;cursor:pointer;
       box-shadow:0 4px 0 #9c7420;font-family:inherit;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #9c7420;}
  .btn.ghost{background:#3a2d5c;color:var(--text);box-shadow:0 4px 0 #241b3a;}
  .hint{color:var(--dim);font-size:13px;line-height:1.7;}
  kbd{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:12px;font-family:inherit;}
  .chargrid,.lucards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .charcard{width:158px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;
            padding:16px 10px;cursor:pointer;transition:.15s;}
  .charcard:hover{transform:translateY(-4px);border-color:var(--gold);}
  .charcard .ci{font-size:42px;}
  .charcard canvas{display:block;margin:0 auto;width:72px;height:75px;}
  .charcard .cn{font-weight:900;font-size:17px;margin:4px 0;}
  .charcard .cd{font-size:12px;color:var(--dim);min-height:32px;line-height:1.5;}
  .charcard .cw{font-size:12px;color:#7fd0ff;margin-top:4px;}
  .lucard{width:172px;background:var(--panel2);border:2px solid var(--line);border-radius:14px;
          padding:18px 12px 14px;cursor:pointer;transition:.12s;position:relative;}
  .lucard:hover{transform:translateY(-5px);border-color:#7fd0ff;}
  .lucard.evo{border-color:var(--gold);background:linear-gradient(180deg,#3a2d10,#241b33);
              box-shadow:0 0 18px rgba(232,182,76,.35);}
  .lucard.evo:hover{border-color:#ffe08a;}
  .lucard .ci{font-size:44px;}
  .lucard .ct{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:1px;}
  .lucard .cn{font-weight:900;margin:4px 0 2px;font-size:16px;}
  .lucard .cd{font-size:13px;color:var(--dim);min-height:38px;line-height:1.5;}
  .lucard .key{position:absolute;top:6px;left:9px;font-size:11px;color:var(--dim);font-weight:800;}
  .lucard .cv{font-size:11px;color:var(--gold);font-weight:900;margin-top:4px;}
  .statgrid{display:flex;gap:22px;justify-content:center;margin:16px 0 4px;font-weight:800;flex-wrap:wrap;}
  .statgrid b{display:block;font-size:20px;color:var(--gold);}
  .chesticon{font-size:72px;filter:drop-shadow(0 0 18px rgba(232,182,76,.6));margin:6px 0;}
  .buildlist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 2px;}
  .buildlist .slot{width:34px;height:34px;font-size:19px;}
  /* ---------- 메타 진행 (BACKLOG #11) ---------- */
  .metaChips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
  .chip{display:inline-block;padding:3px 10px;font-size:12px;font-weight:800;color:#7fd0ff;
        background:rgba(63,140,255,.12);border:1px solid rgba(127,208,255,.4);border-radius:999px;}
  .chip.gold{color:var(--gold);background:rgba(232,182,76,.12);border-color:rgba(232,182,76,.45);}
  .chip.off{color:var(--dim);background:rgba(0,0,0,.25);border-color:var(--line);font-weight:700;}
  #wpick{margin-top:10px;}
  .wptitle{font-size:13px;font-weight:900;color:var(--gold);margin-bottom:6px;}
  .wptitle span{color:var(--dim);font-weight:700;font-size:11px;}
  .wplist{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;}
  .wchip{padding:4px 10px;font-size:12px;font-weight:800;background:var(--panel2);border:2px solid var(--line);
         border-radius:999px;cursor:pointer;transition:.12s;}
  .wchip:hover{border-color:#7fd0ff;}
  .wchip.sel{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(232,182,76,.35);}
  .achgrid{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .achcard{width:150px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px 8px;opacity:.55;}
  .achcard .ai{font-size:30px;}
  .achcard .an{font-weight:900;margin:2px 0;}
  .achcard .ad{font-size:11px;color:var(--dim);min-height:28px;line-height:1.45;}
  .achcard .ab{font-size:11px;color:#7fd0ff;font-weight:800;margin-top:3px;}
  .achcard.got{opacity:1;border-color:var(--gold);box-shadow:0 0 10px rgba(232,182,76,.25);}
  .achcard.got .ab{color:var(--gold);}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div id="lvlabel">LV 1</div>
  <div id="slots"></div>
  <div id="timer">0:00</div>
  <div id="stats"><span id="kills">💀 0</span><span id="gold">💰 0</span></div>
  <div id="bosswrap" class="hidden">
    <div id="bossname"></div>
    <div id="bossbar"><div id="bossfill"></div></div>
  </div>
  <div id="sysbtns"><button id="btnPause" title="일시정지(P)">⏸</button><button id="btnMute" title="소리(M)">🔊</button></div>
  <div id="banner"></div>
  <div id="joy" class="hidden"><div id="joyknob"></div></div>
</div>

<div id="overlay">
  <div id="scr-title" class="screen">
    <div style="font-size:64px">🧛</div>
    <h1>뱀파이어 키우기</h1>
    <p class="hint">뱀서라이크(Vampire Survivors류) 생존 액션 — <b style="color:var(--gold)">10분</b>만 버텨라!</p>
    <p class="hint" style="margin-top:10px">
      이동 <kbd>WASD</kbd> <kbd>방향키</kbd> 또는 화면 드래그 · 공격은 자동<br>
      레벨업 3택으로 성장 · 무기 만렙 + 패시브 + 보물상자 → <b style="color:var(--gold)">무기 진화</b><br>
      일시정지 <kbd>P</kbd> · 소리 <kbd>M</kbd>
    </p>
    <button class="btn" id="btnStart">⚔️ 게임 시작</button>
    <button class="btn ghost" id="btnMeta">🏆 업적</button>
  </div>

  <div id="scr-char" class="screen hidden">
    <h2>캐릭터 선택</h2>
    <div id="metaChips" class="metaChips"></div>
    <div class="chargrid" id="chargrid"></div>
    <div id="wpick" class="hidden"></div>
  </div>

  <div id="scr-meta" class="screen hidden">
    <h2>🏆 업적</h2>
    <p class="hint" id="achCount"></p>
    <p class="hint">업적은 영구 저장되며 <b style="color:var(--gold)">다음 런부터</b> 보너스로 적용된다 (스탯 보너스 최대 +20%)</p>
    <div class="achgrid" id="achgrid"></div>
    <button class="btn" id="btnMetaClose">돌아가기</button>
  </div>

  <div id="scr-levelup" class="screen hidden">
    <h2>⬆️ LEVEL UP! <span id="lulv" style="color:var(--gold)"></span></h2>
    <div class="lucards" id="lucards"></div>
    <div id="luActions">
      <button class="btn ghost" id="btnReroll">🎲 리롤 (2)</button>
      <button class="btn ghost" id="btnSkip">⏭️ 스킵 (체력 8% 회복 + 골드 30)</button>
    </div>
    <p class="hint">클릭 또는 <kbd>1</kbd>~<kbd>3</kbd> · <kbd>R</kbd> 리롤 · <kbd>X</kbd> 스킵</p>
    <div id="luEvoStrip" class="hint"></div>
  </div>

  <div id="scr-chest" class="screen hidden">
    <div id="chestBody"></div>
    <button class="btn" id="btnChest">열기</button>
  </div>

  <div id="scr-pause" class="screen hidden">
    <h2>⏸ 일시정지</h2>
    <div class="buildlist" id="pauseBuild"></div>
    <div class="hint" id="pauseEvo"></div>
    <button class="btn" id="btnResume">계속하기</button>
    <button class="btn ghost" id="btnQuit">포기하기</button>
  </div>

  <div id="scr-end" class="screen hidden">
    <div id="endIcon" style="font-size:60px"></div>
    <h1 id="endTitle"></h1>
    <div class="buildlist" id="endBuild"></div>
    <div class="statgrid" id="endStats"></div>
    <div class="hint" id="endSub"></div>
    <div class="hint" id="endGoal" style="color:var(--gold)"></div>
    <div class="hint" id="endMeta" style="color:#7fd0ff"></div>
    <button class="btn" id="btnRetry">다시 도전</button>
    <button class="btn ghost" id="btnHome">타이틀로</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   🧛 뱀파이어 키우기 (뱀서라이크 — Vampire Survivors 스타일)
   - 단일 HTML 파일, 외부 에셋 없음 (캔버스 드로잉 + WebAudio)
   - 자동 공격 · 경험치 젬 · 레벨업 3택 · 무기 진화(만렙+패시브+상자)
   - 메타 진행(BACKLOG #11): 업적 9종 · 언락 보너스 · localStorage("vs_meta") 영구 저장
   ============================================================ */
window.__errors = [];
window.addEventListener("error", e => __errors.push(e.message));

const $ = id => document.getElementById(id);
const canvas = $("game");
const ctx = canvas.getContext("2d");
let vw = 0, vh = 0;

/* ---------------- 유틸 ---------------- */
const TAU = Math.PI * 2;
const rand  = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const sq    = v => v * v;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick  = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function hash2(x, y){ let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function fmt(t){ t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
  };
}

/* ---------------- AI 픽셀 스프라이트 (상대경로 PNG — file:// 로 열어도 동작, 미로딩 시 기존 드로잉 폴백) ---------------- */
const spriteImg = src => Object.assign(new Image(), { src });
const SPRITES = {
  "enemy-hunter":    spriteImg("game-assets/vampire-survivors/enemy-hunter.png"),
  "enemy-mage":      spriteImg("game-assets/vampire-survivors/enemy-mage.png"),
  "enemy-nun":       spriteImg("game-assets/vampire-survivors/enemy-nun.png"),
  "enemy-warrior":   spriteImg("game-assets/vampire-survivors/enemy-warrior.png"),
  "enemy-paladin":   spriteImg("game-assets/vampire-survivors/enemy-paladin.png"),
  "enemy-alchemist": spriteImg("game-assets/vampire-survivors/enemy-alchemist.png"),
  "enemy-snail":     spriteImg("game-assets/vampire-survivors/enemy-snail.png"),
  "enemy-bat":       spriteImg("game-assets/vampire-survivors/enemy-bat.png"),
  "enemy-pig":       spriteImg("game-assets/vampire-survivors/enemy-pig.png"),
  "boss-slimeking":  spriteImg("game-assets/vampire-survivors/boss-slimeking.png"),
  "boss-shroomking": spriteImg("game-assets/vampire-survivors/boss-shroomking.png"),
  "boss-reaper":     spriteImg("game-assets/vampire-survivors/boss-reaper.png"),
  "item-chest":      spriteImg("game-assets/vampire-survivors/item-chest.png"),
  "item-gem":        spriteImg("game-assets/vampire-survivors/item-gem.png"),
  "item-potion":     spriteImg("game-assets/vampire-survivors/item-potion.png"),
};
const spriteReady = im => !!im && im.complete && im.naturalWidth > 0;

/* ---------------- 사운드 (WebAudio) ---------------- */
let AC = null, muted = false;
function ac(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); } catch (e) {} return AC; }
function tone(f1, f2, dur, type, vol){
  if (muted) return;
  try {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) {}
}
const sfxLast = {};
function throttled(key, ms, fn){ const n = performance.now(); if (n - (sfxLast[key] || 0) < ms) return; sfxLast[key] = n; fn(); }
const SFX = {
  shoot:  () => throttled("shoot", 70,  () => tone(700, 320, 0.06, "square", 0.05)),
  whip:   () => tone(900, 180, 0.09, "sawtooth", 0.08),
  axe:    () => tone(280, 620, 0.12, "triangle", 0.07),
  book:   () => tone(500, 900, 0.14, "triangle", 0.1),
  hit:    () => throttled("hit", 60, () => tone(320, 140, 0.04, "square", 0.07)),
  pop:    () => throttled("pop", 70, () => tone(480, 90, 0.11, "square", 0.1)),
  gem:    () => throttled("gem", 60, () => tone(900, 1500, 0.06, "sine", 0.09)),
  hurt:   () => throttled("hurt", 200, () => tone(140, 60, 0.16, "sawtooth", 0.22)),
  splash: () => tone(400, 120, 0.18, "sine", 0.1),
  boom:   () => tone(150, 30, 0.45, "sawtooth", 0.35),
  pick:   () => tone(600, 950, 0.09, "triangle", 0.12),
  boss:   () => { tone(95, 45, 0.8, "sawtooth", 0.3); setTimeout(() => tone(70, 38, 0.9, "sawtooth", 0.28), 300); },
  bossdie:() => { tone(200, 40, 0.7, "sawtooth", 0.3); setTimeout(() => tone(700, 1400, 0.3, "triangle", 0.2), 350); },
  level:  () => { tone(523, 523, 0.09, "triangle", 0.16); setTimeout(() => tone(659, 659, 0.09, "triangle", 0.16), 90);
                  setTimeout(() => tone(784, 784, 0.14, "triangle", 0.18), 180); },
  evo:    () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, f * 1.01, 0.16, "triangle", 0.18), i * 110));
                  setTimeout(() => tone(1318, 1568, 0.4, "sine", 0.14), 480); },
  chest:  () => { tone(660, 660, 0.1, "sine", 0.14); setTimeout(() => tone(880, 880, 0.12, "sine", 0.14), 110);
                  setTimeout(() => tone(1100, 1320, 0.25, "sine", 0.14), 230); },
  lose:   () => { tone(330, 60, 1.1, "sawtooth", 0.28); setTimeout(() => tone(220, 45, 1.3, "sawtooth", 0.24), 250); },
  win:    () => { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => tone(f, f, 0.16, "triangle", 0.2), i * 140));
                  setTimeout(() => tone(1568, 2093, 0.6, "triangle", 0.18), 750); },
};

/* WAV 파일 효과음 (파일 없으면 조용히 스킵, 음소거 시 무음) */
const WAV_SFX = {
  coin:      "game-assets/sfx/coin.wav",
  hit:       "game-assets/sfx/hit.wav",
  powerup:   "game-assets/sfx/powerup.wav",
  gameover:  "game-assets/sfx/gameover.wav",
  explosion: "game-assets/sfx/explosion.wav",
};
const wavBroken = {};
function playSfx(name, opts){
  if (muted) return;
  const path = WAV_SFX[name];
  if (!path || wavBroken[path]) return;
  const o = opts || {};
  if (o.throttle){
    const now = performance.now(), key = "wav:" + name;
    if (now - (sfxLast[key] || 0) < o.throttle) return;
    sfxLast[key] = now;
  }
  try {

}

// 업적 목록 기준으로 보너스 재계산 + 상한 클램프 (저장값 변조·손상 자가 수복)
function metaRecalc(m){
  const M = m || META;
  const b = { damage:0, hp:0, gold:0, evo:0 };
  for (const id of M.achievements){
    const bn = META_ACH[id] && META_ACH[id].bonus;
    if (!bn) continue;
    for (const k in bn) if (k in b) b[k] += bn[k];
  }
  for (const k in b) b[k] = clamp(b[k], 0, META_CAP[k]);
  M.bonuses = b;
  return M;
}
// localStorage("vs_meta") 로드 — 손상/변조 시 기본값으로 자가 수복
function metaLoad(){
  const def = { achievements:[], bonuses:{ damage:0, hp:0, gold:0, evo:0 } };
  try {
    const raw = localStorage.getItem(META_KEY);
    if (!raw) return def;
    const d = JSON.parse(raw);
    return metaRecalc({
      achievements:[...new Set((Array.isArray(d.achievements) ? d.achievements : []).filter(id => META_ACH[id]))],
      bonuses:Object.assign({}, def.bonuses, d.bonuses),
    });
  } catch (e) { return def; }
}
function metaSave(){
  try { localStorage.setItem(META_KEY, JSON.stringify({ achievements:META.achievements, bonuses:META.bonuses })); } catch (e) {}
}
// 활성 보너스 조회 (상한 클램프 보장) — newGame()에서 스탯 초기화에 사용
function metaBonus(){
  const b = META.bonuses;
  return { damage:clamp(b.damage || 0, 0, META_CAP.damage), hp:clamp(b.hp || 0, 0, META_CAP.hp),
           gold:clamp(b.gold || 0, 0, META_CAP.gold), evo:clamp(b.evo || 0, 0, META_CAP.evo) };
}
// 업적 판정 — 현재 런(G) 기준, 멱등. 임계값 통과 시 해금 → 저장 → 배너 통지
function metaCheck(){
  if (!G) return;
  const fresh = [];
  const add = id => { if (!META.achievements.includes(id)){ META.achievements.push(id); fresh.push(id); } };
  if (G.kills >= 100) add("kill100");
  if (G.kills >= 500) add("kill500");
  if (G.kills >= 1000) add("kill1000");
  if (G.t >= 300) add("survive5");
  if (G.t >= GOAL){ add("survive10"); add("conquer"); }
  if ((G.chests || 0) >= 3) add("chest3");
  if (G.weapons.some(w => w.evolved)) add("evolve");
  if (G.level >= 10) add("level10");
  if (!fresh.length) return;
  metaRecalc(); metaSave();
  for (const id of fresh) if (!META_NEW.includes(id)) META_NEW.push(id);
  const last = META_ACH[fresh[fresh.length - 1]];
  banner("🏆 업적 달성 「" + last.name + "」",
         last.bonusLabel ? "다음 런부터 " + last.bonusLabel + " 적용!" : "업적 목록에서 확인하세요");
}

  const b = metaBonus(), out = [];
  if (b.damage > 0) out.push(`<span class="chip">⚔️ 피해 +${Math.round(b.damage * 100)}%</span>`);
  if (b.hp > 0) out.push(`<span class="chip">❤️ 최대 체력 +${b.hp}</span>`);
  if (b.gold > 0) out.push(`<span class="chip">💰 상자 골드 +${Math.round(b.gold * 100)}%</span>`);
  if (b.evo > 0) out.push(`<span class="chip">✨ 진화 확률 +${Math.round(b.evo * 100)}%</span>`);
  if (META.achievements.includes("conquer")) out.push(`<span class="chip gold">👑 시작 무기 선택</span>`);
  return out.join("");
}

    el.className = "achcard" + (has ? " got" : "");

const keys = {};

window.addEventListener("keydown", e => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === "KeyM") toggleMute();
  if (e.code === "KeyP" || e.code === "Escape"){
    if (scene === "play") setScene("pause");
    else if (scene === "pause") setScene("play");
  }
  if (scene === "levelup" && ["Digit1","Digit2","Digit3"].includes(e.code)) chooseCard(+e.code.slice(-1) - 1);
  if (scene === "levelup" && e.code === "KeyR") doReroll();
  if (scene === "levelup" && e.code === "KeyX") doSkip();
  if (scene === "chest" && (e.code === "Space" || e.code === "Enter")) chestAdvance();
  if (scene === "chestspin") skipChestSpin(); // 슬롯 연출 스킵 (아무 키)
  if (scene === "title" && (e.code === "Enter" || e.code === "Space")) setScene("char");
  if (scene === "meta" && e.code === "Escape") setScene("title"); // BACKLOG #11: 업적 화면 닫기
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
canvas.addEventListener("pointerdown", e => {
  if (scene === "chestspin"){ skipChestSpin(); return; } // 슬롯 연출 스킵 (클릭)
  if (scene !== "play") return;
  joyId = e.pointerId; joyOrigin = { x:e.clientX, y:e.clientY }; joyVec = { x:0, y:0 };
  const j = $("joy"); j.classList.remove("hidden");
  j.style.left = (e.clientX - 55) + "px"; j.style.top = (e.clientY - 55) + "px";
  $("joyknob").style.transform = "translate(0,0)";
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener("pointermove", e => {
  if (e.pointerId !== joyId || !joyOrigin) return;
  let dx = e.clientX - joyOrigin.x, dy = e.clientY - joyOrigin.y;
  const len = Math.hypot(dx, dy), max = 46;
  if (len > max){ dx = dx / len * max; dy = dy / len * max; }
  joyVec = { x: dx / max, y: dy / max };
  $("joyknob").style.transform = `translate(${dx}px,${dy}px)`;
});
function joyEnd(e){
  if (e.pointerId !== joyId) return;
  joyId = null; joyOrigin = null; joyVec = { x:0, y:0 };
  $("joy").classList.add("hidden");
}
canvas.addEventListener("pointerup", joyEnd);
canvas.addEventListener("pointercancel", joyEnd);
window.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("visibilitychange", () => { if (document.hidden && scene === "play") setScene("pause"); });

/* ---------------- 게임 상태 ---------------- */
let scene = "title";   // title | char | play | levelup | chest | chestspin | pause | over | win
let G = null;
let eid = 0;

function xpNeed(lv){ return Math.floor(5 + lv * 5 + Math.pow(lv, 1.6) * 2); }

function newGame(charId){
  const c = CHARS[charId];
  const mb = metaBonus(); // BACKLOG #11: 메타 보너스 (업적 언락분, 상한 클램프 적용)
  G = {
    charId, t:0, kills:0, gold:0, level:1, xp:0, xpNext:xpNeed(1), luQueue:0,
    hitstop:0, rerollLeft:2, dmgDealt:0,
    p:{ x:0, y:0, hp:c.hp, baseHp:c.hp, maxHp:c.hp, baseSpd:c.spd, spd:c.spd, baseRegen:c.regen,
        regen:c.regen, cdm:1, baseArea:c.area || 1, area:c.area || 1, pickR:50, face:1, moving:false, anim:0, hurtT:0, iv:0 },
    passives:{}, weapons:[{ id:(metaStartWeapon || c.weapon), lv:1, t:0.4, evolved:false, books:null, bT:0, bA:0 }], // 정복자 언락: 시작 무기 선택 (미선택 시 캐릭터 기본)
    enemies:[], bullets:[], pools:[], gems:[], pickups:[], texts:[], parts:[], effects:[],
    cam:{ x:0, y:0 }, shake:0, animT:0,
    spawnT:1.2, flockIdx:0, eliteIdx:0, bossIdx:0, boss:null,
    rushFlag:false, slotsDirty:true, chestData:null, chestPhase:"closed", chestApplied:false,
  };
  spinFx = null; // 슬롯 연출 오버레이 상태 초기화 (안전망)
  // BACKLOG #11: 메타 보너스 적용 — 스탯 초기화 시 1회 반영 (런 중 변동 없음)
  G.p.baseHp += mb.hp; G.p.hp += mb.hp;  // 생존자: 최대 체력 +10
  G.p.dmgMult  = 1 + mb.damage;          // 학살자: 피해 +5% (wstats 배수)
  G.p.goldMult = 1 + mb.gold;            // 보물 사냥꾼: 상자 골드 +10% (openChest)
  G.p.evoBonus = mb.evo;                 // 진화론자: 진화 확률 +5% (openChest)
  META_NEW = [];                         // 이번 런 신규 업적 목록 초기화
  recalcStats();
  G.p.hp = G.p.maxHp;
}

function recalcStats(){
  const P = G.p, lv = id => G.passives[id] || 0;
  P.maxHp = Math.round(P.baseHp * (1 + 0.2 * lv("heart")));
  P.spd   = P.baseSpd * (1 + 0.08 * lv("wings"));
  P.cdm   = Math.max(0.4, 1 - 0.08 * lv("tome"));
  P.area  = (P.baseArea || 1) * (1 + 0.12 * lv("candel"));
  P.pickR = 50 * (1 + 0.3 * lv("magnet"));
  P.regen = P.baseRegen + 0.6 * lv("herb");
  P.hp = Math.min(P.hp, P.maxHp);
}

/* ---------------- 스폰 디렉터 ---------------- */
function hpMult(t){ return 1 + Math.pow(t / 60, 1.35) * 0.6; }
function tierType(t){
  let types = TIERS[0][1];
  for (const [tt, ty] of TIERS) if (t >= tt) types = ty;
  return pick(types);
}
function spawnPos(r){
  const a = rand(0, TAU), R = r || (Math.max(vw, vh) * 0.6 + 90);
  return { x: G.p.x + Math.cos(a) * R, y: G.p.y + Math.sin(a) * R };
}
function spawnEnemy(type, pos, force){
  if (!force && G.enemies.length > 240) return null;
  const D = ENEMIES[type], pp = pos || spawnPos();
  const e = { id:++eid, type, icon:D.icon, x:pp.x, y:pp.y,
    hp:D.hp * hpMult(G.t), spd:D.spd * rand(0.9, 1.1), dmg:D.dmg, xp:D.xp, r:D.r,
    flash:0, hitT:0, bibT:0, phase:rand(0, TAU), wob:!!D.wob, elite:false, boss:false, dead:false };
  e.maxHp = e.hp;
  G.enemies.push(e);
  return e;
}
function spawnFlock(f){
  const pp = G.p, R = Math.max(vw, vh) * 0.55 + 70;
  if (f.shape === "ring"){
    for (let i = 0; i < f.n; i++){
      const a = i / f.n * TAU;
      spawnEnemy(pick(f.types), { x:pp.x + Math.cos(a) * R, y:pp.y + Math.sin(a) * R });
    }
  } else {
    const base = rand(0, TAU), rr = R * rand(0.95, 1.05);
    for (let i = 0; i < f.n; i++){
      const a = base + (i - f.n / 2) * 0.09;
      spawnEnemy(pick(f.types), { x:pp.x + Math.cos(a) * rr, y:pp.y + Math.sin(a) * rr });
    }
  }
}
function spawnElite(){
  const e = spawnEnemy(tierType(G.t), null, true);
  if (!e) return;
  e.elite = true; e.hp *= 9; e.maxHp = e.hp; e.r *= 1.45; e.spd *= 0.9; e.dmg = Math.round(e.dmg * 1.6); e.xp *= 12;
}
function spawnBoss(def){
  const e = spawnEnemy("slime", null, true);
  e.type = def.key; e.boss = true;
  e.hp = def.hp; e.maxHp = def.hp; e.spd = def.spd; e.dmg = def.dmg; e.xp = def.xp; e.r = def.r;
  G.boss = e;
  banner("⚠ " + def.name + " 등장!", "처치하면 보물 상자가 떨어진다");
  SFX.boss(); playSfx("explosion", { volume: 0.25 }); G.shake = 8;
}
function director(dt){
  const t = G.t;
  if (G.bossIdx < BOSSES.length && t >= BOSSES[G.bossIdx].t){ spawnBoss(BOSSES[G.bossIdx]); G.bossIdx++; }
  while (G.flockIdx < FLOCKS.length && t >= FLOCKS[G.flockIdx].t){ spawnFlock(FLOCKS[G.flockIdx]); G.flockIdx++; }
  if (G.eliteIdx < ELITE_TIMES.length && t >= ELITE_TIMES[G.eliteIdx]){ spawnElite(); G.eliteIdx++; }
  if (!G.rushFlag && t >= 582){
    G.rushFlag = true;
    banner("💀 죽음의 군단이 몰려온다!");
    spawnFlock({ n:36, types:["wolf","pig","ghost","bat"], shape:"ring" });
  }
  G.spawnT -= dt;
  if (G.spawnT <= 0){
    const k = Math.min(1, t / GOAL);
    G.spawnT = 1.05 - 0.8 * k;
    const n = 1 + Math.floor(t / 140);
    for (let i = 0; i < n; i++) spawnEnemy(tierType(t));
  }
}

/* ---------------- 보스 특수공격 텔레그래프 (BACKLOG #6 — 경고 원 · 돌진 예고선 · 탄막 링 예고) ---------------- */
// 보스별 예고 → 실행: 슬라임 킹=원형 충격파(경고 원 1.5초) · 버섯 대왕=포자 탄막(빨간 외곽선 플래시 0.8초) · 죽음 군주=돌진(예고선 1초)
// 기존 보스 AI(추격·접촉 피해)는 그대로 두고, 예고가 끝난 뒤에만 특수공격을 "추가" 실행한다.
const BOSS_ATTACKS = {
  slimeking:  { tele:"circle", dur:1.5, cd:6.0, first:2.5, range:300, rad:150 },        // 경고 원 — 원형 충격파
  shroomking: { tele:"ring",   dur:0.8, cd:5.0, first:3.0, range:0,   n:16, bSpd:150 }, // 탄막 링 예고 — 360° 포자 탄환
  reaper:     { tele:"charge", dur:1.0, cd:7.0, first:2.0, range:460, dashSpd:640 },    // 돌진 예고선 — 고정 지점 돌진
};
// 예고 상태 갱신: 쿨다운 → 사거리 진입 시 telegraph 부여 → dur 경과 후 실행 (일시정지 시 G.t도 멈춰 안전)
function updateBossTelegraphs(dt){
  if (!G.ebullets) G.ebullets = []; // 보스 탄환 저장소 (지연 초기화)
  updateEbullets(dt);               // 보스 사망 후에도 남은 탄환은 계속 진행
  const b = G.boss, P = G.p;
  if (!b || b.dead) return;
  const A = BOSS_ATTACKS[b.type];
  if (!A) return; // 특수공격이 없는 보스는 우아하게 스킵
  if (b.dash){ // 돌진 진행: 예고 때 고정한 목표 지점으로 고속 이동 (피해는 기존 접촉 판정 사용)
    b.dash.t -= dt;
    b.x += b.dash.vx * dt; b.y += b.dash.vy * dt;
    if (b.dash.t <= 0 || dist2(b.x, b.y, b.dash.tx, b.dash.ty) < sq(18)) b.dash = null;
    return; // 돌진 중에는 새 예고를 시작하지 않는다
  }
  if (b.telegraph){ // 예고 진행 중 — 시간이 차면 공격 실행
    if (G.t - b.telegraph.start >= b.telegraph.dur){
      const tg = b.telegraph;
      b.telegraph = null;
      execBossAttack(b, A, tg);
      b.atkCd = A.cd; // 실행 후 쿨다운
    }
    return;
  }
  b.atkCd = (b.atkCd === undefined ? A.first : b.atkCd - dt); // 첫 예고는 등장 후 여유를 준다
  if (b.atkCd > 0) return;
  if (A.range && Math.hypot(P.x - b.x, P.y - b.y) > A.range) return; // 사거리 밖이면 대기
  // 예고 시작: targetX/Y는 시작 시점 플레이어 위치로 고정 → 플레이어는 움직여서 회피 가능
  b.telegraph = { type:A.tele, start:G.t, dur:A.dur, x:P.x, y:P.y };
  if (A.tele === "circle") b.telegraph.rad = A.rad;
  throttled("bossTele", 250, () => tone(980, 430, 0.2, "square", 0.13)); // 예고 경고음
}
// 예고 종료 — 보스별 특수공격 실행 (신규 추가 공격: 기존 공격·피해 로직은 수정 없음)
function execBossAttack(b, A, tg){
  const P = G.p;
  if (tg.type === "circle"){ // 슬라임 킹: 예고 원 내부에 플레이어가 있으면 피해
    if (dist2(P.x, P.y, tg.x, tg.y) < sq(tg.rad)) damagePlayer(Math.round(b.dmg * 1.25));
    G.effects.push({ type:"ring", x:tg.x, y:tg.y, r:tg.rad, t:0.4, max:0.4 });
    burst(tg.x, tg.y, "#8ee08e", 16, 220);
    SFX.boom(); G.shake = Math.min(10, G.shake + 6);
  } else if (tg.type === "ring"){ // 버섯 대왕: 360° 포자 탄환
    const dmg = Math.max(8, Math.round(b.dmg * 0.45));
    for (let i = 0; i < A.n; i++){
      const a = i / A.n * TAU + rand(-0.04, 0.04);
      G.ebullets.push({ x:b.x, y:b.y, vx:Math.cos(a) * A.bSpd, vy:Math.sin(a) * A.bSpd, r:7, dmg, t:3.2 });
    }
    if (G.ebullets.length > 140) G.ebullets.splice(0, G.ebullets.length - 140); // 안전 상한
    SFX.splash();
  } else if (tg.type === "charge"){ // 죽음 군주: 고정 지점으로 돌진 (통과 시 기존 접촉 피해)
    const d = Math.hypot(tg.x - b.x, tg.y - b.y) || 1;
    b.dash = { vx:(tg.x - b.x) / d * A.dashSpd, vy:(tg.y - b.y) / d * A.dashSpd,
               t:d / A.dashSpd + 0.1, tx:tg.x, ty:tg.y };
    SFX.boom(); G.shake = Math.min(10, G.shake + 4);
  }
}
// 보스 탄환: 이동 + 플레이어 충돌 (피해·무적시간 처리는 기존 damagePlayer 재사용)
function updateEbullets(dt){
  const P = G.p, bs = G.ebullets;
  for (let i = bs.length - 1; i >= 0; i--){
    const bl = bs[i];
    bl.t -= dt; bl.x += bl.vx * dt; bl.y += bl.vy * dt;
    if (bl.t <= 0){ bs.splice(i, 1); continue; }
    if (dist2(bl.x, bl.y, P.x, P.y) < sq(bl.r + 12)){ bs.splice(i, 1); damagePlayer(bl.dmg); }
  }
}
/* 텔레그래프 렌더 — 지면 레벨 (render()에서 엔티티 렌더 전에 호출) */
function drawTelegraphs(){
  const b = G.boss;
  if (!b || b.dead || !b.telegraph) return;
  const tg = b.telegraph;
  const p = clamp((G.t - tg.start) / tg.dur, 0, 1);   // 예고 경과율 0→1
  const pulse = 0.5 + 0.5 * Math.sin(G.animT * 10);   // sin파 맥동
  if (tg.type === "circle"){ // 경고 원: 반투명 붉은 원(채움 + 외곽선) + 경과율 링
    ctx.fillStyle = `rgba(255,60,60,${0.3 + 0.15 * pulse})`;
    circle(tg.x, tg.y, tg.rad);
    ctx.strokeStyle = `rgba(255,96,96,${0.4 + 0.2 * pulse})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(tg.x, tg.y, tg.rad, 0, TAU); ctx.stroke();
    ctx.strokeStyle = `rgba(255,214,200,${0.45 + 0.25 * pulse})`; // 링이 가득 차면 실행
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(tg.x, tg.y, tg.rad * p, 0, TAU); ctx.stroke();
  } else if (tg.type === "charge"){ // 돌진 예고선: 보스 → 고정 목표 붉은 점선 + 화살촉
    ctx.save();
    ctx.setLineDash([16, 12]);
    ctx.lineDashOffset = -G.animT * 70; // 흐르는 점선
    ctx.strokeStyle = `rgba(255,70,70,${0.35 + 0.2 * pulse})`;
    ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(tg.x, tg.y); ctx.stroke();
    ctx.setLineDash([]);
    const ang = Math.atan2(tg.y - b.y, tg.x - b.x);
    ctx.strokeStyle = `rgba(255,96,96,${0.5 + 0.25 * pulse})`;
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(tg.x, tg.y, 13 + 5 * pulse, 0, TAU); ctx.stroke(); // 목표 표식
    ctx.beginPath(); // 화살촉
    ctx.moveTo(tg.x - Math.cos(ang - 0.5) * 18, tg.y - Math.sin(ang - 0.5) * 18);
    ctx.lineTo(tg.x, tg.y);
    ctx.lineTo(tg.x - Math.cos(ang + 0.5) * 18, tg.y - Math.sin(ang + 0.5) * 18);
    ctx.stroke();
    ctx.restore();
  }
}
/* 탄막 링 예고(보스 빨간 외곽선 플래시) + 보스 탄환 — 엔티티 위에 그려야 하므로 render() 후반에 호출 */
function drawBossTelegraphTop(){
  drawEbullets();
  const b = G.boss;
  if (!b || b.dead || !b.telegraph || b.telegraph.type !== "ring") return;
  const pulse = 0.5 + 0.5 * Math.sin(G.animT * 18); // 빠른 플래시
  ctx.strokeStyle = `rgba(255,60,60,${0.35 + 0.3 * pulse})`;
  ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.3, 0, TAU); ctx.stroke();
  ctx.strokeStyle = `rgba(255,60,60,${0.18 + 0.18 * pulse})`; // 바깥 보조 링
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, TAU); ctx.stroke();
}
// 보스 탄환 렌더 (플레이어 탄환과 구별되는 붉은 계열)
function drawEbullets(){
  const bs = G.ebullets || [];
  for (const bl of bs){
    ctx.fillStyle = "rgba(255,90,90,0.3)";
    circle(bl.x, bl.y, bl.r + 3);
    ctx.fillStyle = "#ffc0b0";
    circle(bl.x, bl.y, bl.r * 0.55);
  }
}

/* ---------------- 전투 헬퍼 ---------------- */
function addText(x, y, txt, col, crit){
  if (G.texts.length > 80) G.texts.shift();
  G.texts.push({ x, y, txt, col, crit: !!crit, t:0.8, vy:-42 });
}
function burst(x, y, col, n, sp){
  n = n || 6; sp = sp || 120;
  for (let i = 0; i < n; i++){
    if (G.parts.length > 260) G.parts.shift();
    G.parts.push({ x, y, vx:rand(-1,1)*sp, vy:rand(-1,1)*sp - 50, t:rand(0.3,0.6), col, r:rand(2,4.5) });
  }
}
function dealDmg(e, dmg, opts){
  if (e.dead) return;
  opts = opts || {};
  let d = dmg, crit = false;
  if (opts.crit && Math.random() < opts.crit){ d *= 2; crit = true; }
  e.hp -= d; e.flash = 0.13;
  G.dmgDealt += d; // 런 종료 요약용 누적 피해량 (무기·오라·웅덩이·폭탄 출처 불문)
  addText(e.x + rand(-9,9), e.y - e.r - 8, Math.round(d), crit ? "#ffd24a" : "#ffffff", crit);
  if (opts.lifesteal) G.p.hp = Math.min(G.p.maxHp, G.p.hp + opts.lifesteal);
  if (e.hp <= 0) killEnemy(e);
}
function hitRect(cx, cy, hw, hh, dmg, opts){
  let n = 0;
  for (const e of G.enemies){
    if (e.dead) continue;
    if (Math.abs(e.x - cx) < hw + e.r && Math.abs(e.y - cy) < hh + e.r){ dealDmg(e, dmg, opts); n++; }
  }
  return n;
}
function hitRadius(x, y, r, dmg, opts){
  let n = 0;
  for (const e of G.enemies){
    if (e.dead) continue;
    if (dist2(x, y, e.x, e.y) < sq(r + e.r)){ dealDmg(e, dmg, opts); n++; }
  }
  return n;
}
function nearestEnemy(x, y, maxD){
  let best = null, bd = maxD * maxD;
  for (const e of G.enemies){
    if (e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if (d < bd){ bd = d; best = e; }
  }
  return best;
}
function knockback(e, fx, fy, f){
  const d = Math.hypot(e.x - fx, e.y - fy) || 1;
  const k = e.boss ? f * 0.15 : f;
  e.x += (e.x - fx) / d * k; e.y += (e.y - fy) / d * k;
}
function killEnemy(e){
  if (e.dead) return;
  e.dead = true;
  G.kills++;
  const col = (e.elite || e.boss) ? "#ff5b5b" : (ENEMIES[e.type] && ENEMIES[e.type].col) || "#b9a7e0";
  burst(e.x, e.y, col, e.boss ? 30 : e.elite ? 18 : 6);
  if (e.elite || e.boss){
    // 엘리트/보스 처치 연출: 링 이펙트(기존 "ring" 타입 재사용) + 히트스톱
    G.effects.push({ type:"ring", x:e.x, y:e.y, r:e.r*3, t:0.35, max:0.35 });
    G.hitstop = Math.max(G.hitstop, e.boss ? 0.09 : 0.05);
  }
  if (e.elite) G.shake = Math.min(10, G.shake + 5);
  dropGem(e.x, e.y, e.xp);
  if (e.elite) G.pickups.push({ x:e.x, y:e.y, kind:pick(["magnet","chicken","bomb"]), ph:rand(0,TAU) });
  if (e.boss){
    G.boss = null; G.gold += 100;
    G.pickups.push({ x:e.x, y:e.y, kind:"chest", ph:0 });
    banner("🎁 보물 상자!", "상자를 열어 무기를 진화시켜라");
    SFX.bossdie(); G.shake = 12;
  } else if (e.elite) playSfx("explosion", { volume: 0.35 });
  else SFX.pop();
}
function dropGem(x, y, v){
  if (G.gems.length >= 220){
    let best = null, bd = Infinity;
    for (const g of G.gems){ const d = dist2(x, y, g.x, g.y); if (d < bd){ bd = d; best = g; } }
    if (best){ best.v += v; return; }
  }
  G.gems.push({ x:x + rand(-6,6), y:y + rand(-6,6), v, att:false, ph:rand(0,TAU) });
}
function damagePlayer(d){
  const P = G.p;
  if (P.iv > 0 || P.hp <= 0) return;
  P.iv = 0.25; P.hp -= d; P.hurtT = 0.35;
  G.hitstop = Math.max(G.hitstop, 0.04);
  G.shake = Math.min(10, G.shake + 3);
  addText(P.x, P.y - 26, "-" + d, "#ff6b6b");
  SFX.hurt(); playSfx("hit", { throttle: 200 });
  if (P.hp <= 0){ P.hp = 0; setScene("over"); SFX.lose(); playSfx("gameover"); }
}

/* ---------------- 무기 시스템 ---------------- */
function wstats(w){
  const P = G.p, D = WEAPONS[w.id], L = Math.min(w.lv, 8);
  if (w.evolved){
    const E = EVO[w.id];
    return { dmg:E.dmg * (P.dmgMult || 1), cd:(E.cd || 1) * P.cdm, count:E.count || 1, area:P.area, rad:(E.rad || 60) * P.area, spd:360 }; // dmg에 메타 피해 배수 (BACKLOG #11)
  }
  return {
    dmg:D.dmg[L-1] * (P.dmgMult || 1), // 메타 피해 배수 (BACKLOG #11)
    cd:D.cd * P.cdm,
    count:D.count ? D.count[L-1] : 1,
    area:P.area * (D.ar ? D.ar[L-1] : 1),
    rad:(D.rad ? D.rad[L-1] : 0) * P.area,
    spd:360,
  };
}
function garlicRad(w){
  return (w.evolved ? EVO.garlic.rad : WEAPONS.garlic.rad[Math.min(w.lv,8)-1]) * G.p.area;
}
function fireWeapon(w){
  const S = wstats(w), P = G.p;
  if (w.id === "whip"){
    SFX.whip();
    const hw = 80 * S.area, hh = 55 * S.area;
    const opts = w.evolved ? { crit:0.3, lifesteal:2 } : {};
    const fx = P.x + P.face * hw;
    G.effects.push({ type:"slash", x:fx, y:P.y - 4, dir:P.face, area:S.area, t:0.2, max:0.2 });
    hitRect(fx, P.y - 4, hw, hh, S.dmg, opts);
    if (w.lv >= 4 || w.evolved){
      const bx = P.x - P.face * hw;
      G.effects.push({ type:"slash", x:bx, y:P.y - 4, dir:-P.face, area:S.area, t:0.2, max:0.2 });
      hitRect(bx, P.y - 4, hw, hh, S.dmg, opts);
    }
  }
  else if (w.id === "wand"){
    const tgt = nearestEnemy(P.x, P.y, 720);
    const baseA = tgt ? Math.atan2(tgt.y - P.y, tgt.x - P.x) : (P.face > 0 ? 0 : Math.PI);
    const spd = w.evolved ? 520 : 360;
    for (let i = 0; i < S.count; i++){
      const a = baseA + (i - (S.count - 1) / 2) * 0.14;
      G.bullets.push({ kind:"wand", x:P.x, y:P.y - 6, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd,
                       r:6, dmg:S.dmg, pierce:0, t:1.6, hit:[] });
    }
    SFX.shoot();
  }
  else if (w.id === "axe"){
    if (w.evolved){
      const n = 10;
      for (let i = 0; i < n; i++){
        const a = i / n * TAU + rand(-0.1, 0.1);
        G.bullets.push({ kind:"knife", x:P.x, y:P.y, vx:Math.cos(a)*175, vy:Math.sin(a)*175,
                         r:13, dmg:S.dmg, pierce:3, t:2.2, hit:[], rot:a });
      }
      SFX.axe();
    } else {
      for (let i = 0; i < S.count; i++){
        G.bullets.push({ kind:"axe", x:P.x, y:P.y - 10, vx:P.face*rand(30,130)+rand(-30,30), vy:-rand(300,430),
                         g:760, r:17, dmg:S.dmg, pierce:99, t:2.4, hit:[], rot:rand(0,TAU) });
      }
      SFX.axe();
    }
  }
  else if (w.id === "holy"){
    for (let i = 0; i < S.count; i++){
      const tgt = nearestEnemy(P.x + rand(-200,200), P.y + rand(-200,200), 500);
      let tx, ty;
      if (tgt){ tx = tgt.x; ty = tgt.y; }
      else { const a = rand(0, TAU), d = rand(130, 320); tx = P.x + Math.cos(a)*d; ty = P.y + Math.sin(a)*d; }
      G.bullets.push({ kind:"flask", sx:P.x, sy:P.y - 10, tx, ty, x:P.x, y:P.y - 10,
                       dur:0.8, t:0, dmg:S.dmg, rad:S.rad, evolved:w.evolved });
    }
    SFX.axe();
  }
}
function updateBible(w, dt){
  const P = G.p;
  if (w.books){
    const R = (w.evolved ? 115 : 95) * P.area;
    const spd = w.evolved ? 2.6 : (2.0 + 0.12 * w.lv);
    w.bA += spd * dt;
    const n = w.books.length, dmg = w.evolved ? EVO.bible.dmg : wstats(w).dmg;
    for (let i = 0; i < n; i++){
      const a = w.bA + i / n * TAU, b = w.books[i];
      b.x = P.x + Math.cos(a) * R; b.y = P.y + Math.sin(a) * R * 0.82;
      for (const e of G.enemies){
        if (e.dead || e.bibT > 0) continue;
        const rr = 24 * P.area + e.r;
        if (dist2(b.x, b.y, e.x, e.y) < rr * rr){ e.bibT = 0.5; dealDmg(e, dmg, {}); SFX.hit(); }
      }
    }
    if (!w.evolved){
      w.bT -= dt;
      if (w.bT <= 0){ w.books = null; w.t = wstats(w).cd; }
    }
  } else {
    w.t -= dt;
    if (w.t <= 0){
      const n = w.evolved ? 4 : wstats(w).count;
      w.books = []; w.bA = 0;
      for (let i = 0; i < n; i++) w.books.push({ x:P.x, y:P.y });
      if (!w.evolved) w.bT = WEAPONS.bible.dur[Math.min(w.lv,8)-1];
      SFX.book();
    }
  }
}
function updateWeapons(dt){
  const P = G.p;
  for (const w of G.weapons){
    if (w.id === "garlic"){
      w.t -= dt;
      if (w.t <= 0){
        w.t = 0.45 * P.cdm;
        const rad = garlicRad(w);
        const dmg = w.evolved ? EVO.garlic.dmg : WEAPONS.garlic.dmg[Math.min(w.lv,8)-1];
        let hits = 0;
        for (const e of G.enemies){
          if (e.dead) continue;
          if (dist2(e.x, e.y, P.x, P.y) < sq(rad + e.r)){ dealDmg(e, dmg, {}); knockback(e, P.x, P.y, 22); hits++; }
        }
        if (hits > 0){
          throttled("garlic", 200, () => tone(240, 120, 0.08, "sawtooth", 0.05));
          if (w.evolved) P.hp = Math.min(P.maxHp, P.hp + 2);
        }
      }
      continue;
    }
    if (w.id === "bible"){ updateBible(w, dt); continue; }
    w.t -= dt;
    if (w.t <= 0){ fireWeapon(w); w.t = wstats(w).cd; }
  }
}

/* ---------------- 업데이트 ---------------- */
function updatePlayer(dt){
  const P = G.p;
  P.hurtT = Math.max(0, P.hurtT - dt);
  P.iv = Math.max(0, P.iv - dt);
  P.hp = Math.min(P.maxHp, P.hp + P.regen * dt);
  let dx = 0, dy = 0;
  if (keys.KeyW || keys.ArrowUp) dy -= 1;
  if (keys.KeyS || keys.ArrowDown) dy += 1;
  if (keys.KeyA || keys.ArrowLeft) dx -= 1;
  if (keys.KeyD || keys.ArrowRight) dx += 1;
  if (Math.hypot(joyVec.x, joyVec.y) > 0.18){ dx = joyVec.x; dy = joyVec.y; }
  const len = Math.hypot(dx, dy);
  P.moving = len > 0.01;
  if (P.moving){
    dx /= len; dy /= len;
    P.x += dx * P.spd * dt; P.y += dy * P.spd * dt;
    if (dx > 0.1) P.face = 1; else if (dx < -0.1) P.face = -1;
    P.anim += dt;
  }
}
function updateEnemies(dt){
  const P = G.p, es = G.enemies;
  for (const e of es){
    if (e.dead) continue;
    e.flash = Math.max(0, e.flash - dt);
    e.hitT = Math.max(0, e.hitT - dt);
    e.bibT = Math.max(0, e.bibT - dt);
    let dx = P.x - e.x, dy = P.y - e.y;
    const d = Math.hypot(dx, dy) || 1;
    let vx = dx / d * e.spd, vy = dy / d * e.spd;
    if (e.wob){
      const s = Math.sin(G.animT * 5 + e.phase) * e.spd * 0.45;
      vx += -dy / d * s; vy += dx / d * s;
    }
    e.x += vx * dt; e.y += vy * dt;
    if (d < e.r + 12 && e.hitT <= 0){ e.hitT = 0.85; damagePlayer(e.dmg); }
  }
  for (let i = 0; i < es.length; i++){
    const a = es[i]; if (a.dead) continue;
    for (let j = i + 1; j < es.length; j++){
      const b = es[j]; if (b.dead) continue;
      const dx = b.x - a.x, dy = b.y - a.y, rr = (a.r + b.r) * 0.8, d2 = dx*dx + dy*dy;
      if (d2 > 0.01 && d2 < rr*rr){
        const d = Math.sqrt(d2), f = (rr - d) * 0.25, ux = dx / d, uy = dy / d;
        a.x -= ux * f; a.y -= uy * f; b.x += ux * f; b.y += uy * f;
      }
    }
  }
  G.enemies = es.filter(e => !e.dead);
}
function updateBullets(dt){
  const bs = G.bullets;
  for (let i = bs.length - 1; i >= 0; i--){
    const b = bs[i];
    if (b.kind === "flask"){
      b.t += dt;
      const k = Math.min(1, b.t / b.dur);
      b.x = lerp(b.sx, b.tx, k);
      b.y = lerp(b.sy, b.ty, k) - Math.sin(k * Math.PI) * 90;
      if (k >= 1){
        G.pools.push({ x:b.tx, y:b.ty, r:b.rad, dmg:b.dmg, life:b.evolved ? 3.0 : 2.5, tick:0, boom:b.evolved ? 120 : 0 });
        bs.splice(i, 1); SFX.splash();
      }
      continue;
    }
    b.t -= dt;
    if (b.kind === "axe"){ b.vy += b.g * dt; b.rot += dt * 10; }
    if (b.kind === "knife") b.rot += dt * 14;
    b.x += b.vx * dt; b.y += b.vy * dt;
    let dead = b.t <= 0;
    if (!dead){
      for (const e of G.enemies){
        if (e.dead || b.hit.includes(e.id)) continue;
        const rr = b.r + e.r;
        if (dist2(b.x, b.y, e.x, e.y) < rr * rr){
          b.hit.push(e.id);
          dealDmg(e, b.dmg, { crit: b.kind === "axe" ? 0.15 : 0 });
          if (b.kind === "axe" || b.kind === "knife") knockback(e, b.x, b.y, 30);
          SFX.hit();
          if (b.hit.length > b.pierce){ dead = true; break; }
        }
      }
    }
    if (dead) bs.splice(i, 1);
  }
}
function updatePools(dt){
  for (let i = G.pools.length - 1; i >= 0; i--){
    const p = G.pools[i];
    p.life -= dt; p.tick -= dt;
    if (p.tick <= 0){
      p.tick = 0.4;
      hitRadius(p.x, p.y, p.r, p.dmg, {});
    }
    if (p.life <= 0){
      if (p.boom){ hitRadius(p.x, p.y, p.r * 1.5, p.boom, {}); G.effects.push({ type:"ring", x:p.x, y:p.y, r:p.r*1.5, t:0.35, max:0.35 }); SFX.boom(); G.shake = Math.min(10, G.shake + 5); }
      G.pools.splice(i, 1);
    }
  }
}
function updateGems(dt){
  const P = G.p, gs = G.gems;
  for (let i = gs.length - 1; i >= 0; i--){
    const g = gs[i];
    const d2p = dist2(g.x, g.y, P.x, P.y);
    if (!g.att && d2p < sq(P.pickR)) g.att = true;
    if (g.att){
      const d = Math.sqrt(d2p) || 1;
      g.x += (P.x - g.x) / d * 560 * dt;
      g.y += (P.y - g.y) / d * 560 * dt;
      if (d < 16){ gs.splice(i, 1); gainXp(g.v); SFX.gem(); playSfx("coin", { volume: 0.35, throttle: 90 }); }
    }
  }
}
function updatePickups(dt){
  const P = G.p, ps = G.pickups;
  for (let i = ps.length - 1; i >= 0; i--){
    const k = ps[i];
    if (k.kind !== "chest" && dist2(k.x, k.y, P.x, P.y) < sq(P.pickR * 0.8)){
      const d = Math.hypot(P.x - k.x, P.y - k.y) || 1;
      k.x += (P.x - k.x) / d * 300 * dt; k.y += (P.y - k.y) / d * 300 * dt;
    }
    if (dist2(k.x, k.y, P.x, P.y) < sq(k.kind === "chest" ? 28 : 20)){
      ps.splice(i, 1);
      applyPickup(k.kind);
    }
  }
}
function applyPickup(kind){
  const P = G.p;
  if (kind === "magnet"){ for (const g of G.gems) g.att = true; SFX.pick(); addText(P.x, P.y - 30, "🧲 자석!", "#7fd0ff"); }
  else if (kind === "chicken"){ P.hp = Math.min(P.maxHp, P.hp + 40); SFX.pick(); addText(P.x, P.y - 30, "+40", "#6bff8f"); }
  else if (kind === "bomb"){
    SFX.boom(); G.shake = 10;

    for (const e of G.enemies){
      if (e.dead) continue;
      if (dist2(e.x, e.y, P.x, P.y) < sq(Math.max(vw, vh) * 0.5)) dealDmg(e, 400, {});
    }
    addText(P.x, P.y - 30, "💣 폭탄!", "#ffd24a");
  }
  else if (kind === "chest") openChest();
}
function updateFx(dt){
  for (let i = G.texts.length - 1; i >= 0; i--){
    const t = G.texts[i]; t.t -= dt; t.y += t.vy * dt;
    if (t.t <= 0) G.texts.splice(i, 1);
  }
  for (let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i]; p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 320 * dt;
    if (p.t <= 0) G.parts.splice(i, 1);
  }
  for (let i = G.effects.length - 1; i >= 0; i--){
    const e = G.effects[i]; e.t -= dt;
    if (e.t <= 0) G.effects.splice(i, 1);
  }
}
function update(dt){
  if (G.luQueue > 0){ setScene("levelup"); return; }
  if (G.hitstop > 0){ // 히트스톱: 완전 정지 대신 12% 슬로모션 (타격감 유지, 입력 끊김 방지)
    G.hitstop -= dt;
    dt *= 0.12;
  }
  G.t += dt;
  G.animT += dt;
  metaCheck(); // BACKLOG #11: 업적 판정 (처치·생존·레벨·상자·진화 — 매 프레임 멱등 체크)
  if (G.t >= GOAL){ setScene("win"); SFX.win(); return; }
  director(dt);
  updatePlayer(dt);
  updateWeapons(dt);
  updateEnemies(dt);
  updateBossTelegraphs(dt); // BACKLOG #6: 보스 특수공격 예고 → 실행 (기존 보스 AI 이후에 추가)
  updateBullets(dt);
  updatePools(dt);
  updateGems(dt);
  updatePickups(dt);
  updateFx(dt);
  G.shake = Math.max(0, G.shake - dt * 22);
  G.cam.x = lerp(G.cam.x, G.p.x, Math.min(1, dt * 6));
  G.cam.y = lerp(G.cam.y, G.p.y, Math.min(1, dt * 6));
  hudUpd();
}

/* ---------------- 성장 / 진화 ---------------- */
function gainXp(v){
  G.xp += v;
  while (G.xp >= G.xpNext){ G.xp -= G.xpNext; G.level++; G.xpNext = xpNeed(G.level); G.luQueue++; }
  if (G.luQueue > 0 && scene === "play") setScene("levelup");
}
function owned(id){ return G.weapons.find(w => w.id === id); }
function rollChoices(){
  const out = [];
  const evos = shuffle(G.weapons.filter(w => !w.evolved && w.lv >= 8 && (G.passives[EVO[w.id].passive] || 0) > 0).map(w => w.id));
  for (const id of evos) out.push({ type:"evo", id });
  const pool = [];
  const wSlots = G.weapons.length < 6;
  for (const id of Object.keys(WEAPONS)) if (!owned(id) && wSlots) pool.push({ type:"wnew", id });
  for (const w of G.weapons) if (!w.evolved && w.lv < 8) pool.push({ type:"wup", id:w.id });
  const pSlots = Object.keys(G.passives).length < 6;
  for (const id of Object.keys(PASSIVES)){
    const lv = G.passives[id] || 0;
    if (lv === 0 && pSlots) pool.push({ type:"pnew", id });
    else if (lv > 0 && lv < PASSIVES[id].max) pool.push({ type:"pup", id });
  }
  shuffle(pool);
  for (const c of pool){
    if (out.length >= 3) break;
    if (!out.some(o => o.id === c.id)) out.push(c);
  }
  let fb = 0;
  while (out.length < 3) out.push({ type: fb++ % 2 ? "gold" : "heal" });
  return out.slice(0, 3);
}

  if (isReroll) SFX.pick(); // 리롤 재호출은 팡파레 생략
  else { SFX.level(); playSfx("powerup"); }
}
function doReroll(){
  if (scene !== "levelup" || G.rerollLeft <= 0) return;
  G.rerollLeft--;
  buildLevelUp(true);
}
function doSkip(){
  if (scene !== "levelup") return;
  const heal = Math.ceil(G.p.maxHp * 0.08);
  G.p.hp = Math.min(G.p.maxHp, G.p.hp + heal);
  G.gold += 30;
  addText(G.p.x, G.p.y - 30, "+" + heal, "#6bff8f");
  G.luQueue--;
  if (G.luQueue > 0) buildLevelUp();
  else setScene("play");
}
function chooseCard(i){
  if (scene !== "levelup" || !luChoices[i]) return;
  const c = luChoices[i];
  if (c.type === "evo"){ const w = owned(c.id); w.evolved = true; G.effects.push({ type:"ring", x:G.p.x, y:G.p.y, r:120, t:0.5, max:0.5 }); SFX.evo(); G.slotsDirty = true; }
  else if (c.type === "wnew"){ G.weapons.push({ id:c.id, lv:1, t:0.3, evolved:false, books:null, bT:0, bA:0 }); G.slotsDirty = true; }
  else if (c.type === "wup"){ owned(c.id).lv++; G.slotsDirty = true; }
  else if (c.type === "pnew" || c.type === "pup"){ G.passives[c.id] = (G.passives[c.id] || 0) + 1; recalcStats(); G.slotsDirty = true; }
  else if (c.type === "heal"){ G.p.hp = Math.min(G.p.maxHp, G.p.hp + 30); addText(G.p.x, G.p.y - 30, "+30", "#6bff8f"); }
  else if (c.type === "gold"){ G.gold += 60; }
  G.luQueue--;
  if (G.luQueue > 0) buildLevelUp();
  else setScene("play");
}
function openChest(){
  G.chests = (G.chests || 0) + 1; // BACKLOG #11: 보물 상자 획득 수 (업적 판정)
  const ready = G.weapons.filter(w => !w.evolved && w.lv >= 8 && (G.passives[EVO[w.id].passive] || 0) > 0);
  let data;
  if (ready.length) data = { evoId:ready[0].id };
  else {
    // BACKLOG #11 메타 보너스: ① 진화 확률 +5% — 만렙은 됐지만 재료 패시브가 없는 무기를 확률로 강제 진화
    //                          ② 상자 골드 +10% (goldMult) — 진화 실패 시 대체 재화에만 적용
    const near = G.weapons.find(w => !w.evolved && w.lv >= 8);
    if (near && Math.random() < (G.p.evoBonus || 0)) data = { evoId:near.id };
    else data = { gold:Math.round(100 * (G.p.goldMult || 1)), heal:40 };
  }
  G.chestData = data;
  G.chestPhase = "closed"; G.chestApplied = false;
  SFX.chest(); playSfx("powerup", { playbackRate: 0.7 });
  startChestSpin(); // BACKLOG #5: 슬롯머신 연출 후 기존 결과 화면으로 전환
  metaCheck(); // 상자 3개 업적 판정
}
function chestAdvance(){
  if (scene !== "chest") return;
  if (G.chestPhase === "closed"){
    G.chestPhase = "open";
    if (!G.chestApplied){
      G.chestApplied = true;
      if (G.chestData.evoId){
        const w = owned(G.chestData.evoId);
        w.evolved = true; G.slotsDirty = true;
        G.effects.push({ type:"ring", x:G.p.x, y:G.p.y, r:140, t:0.6, max:0.6 });
        SFX.evo();
      } else {
        G.gold += G.chestData.gold;
        G.p.hp = Math.min(G.p.maxHp, G.p.hp + G.chestData.heal);
      }
    }
    metaCheck(); // BACKLOG #11: 진화/상자 업적 판정
    buildChest();
  } else {
    if (G.luQueue > 0) setScene("levelup");
    else setScene("play");
  }
}
function buildChest(){

      대신 <b style="color:var(--gold)">골드 +${G.chestData.gold}</b>, <b style="color:#6bff8f">체력 +${G.chestData.heal}</b> 획득!<br>
      힌트: 무기 만렙(8) + 전용 패시브를 갖추면 진화한다</p>`;

/* ---------------- 보물상자 슬롯머신 연출 (BACKLOG #5 — 캔버스 오버레이, 총 ~2.5초) ---------------- */
// 희귀도 메타: common=흰색 · rare=파랑 · epic=보라 · legendary=금색
const RARITY = {
  common:    { col:"#ececf4", rgb:"236,236,244", label:"일반" },
  rare:      { col:"#4d9fff", rgb:"77,159,255", label:"희귀" },
  epic:      { col:"#b06bff", rgb:"176,107,255", label:"영웅" },
  legendary: { col:"#e8b64c", rgb:"232,182,76", label:"전설" },
};
let spinFx = null; // 슬롯 연출 오버레이 상태 (씬 "chestspin" 동안만 존재)
const backOut = p => { const c1 = 1.70158; return 1 + (c1 + 1) * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
// 희귀도 결정: 진화 상자는 항상 전설, 그 외엔 진행도(G.t/GOAL) 비례 가중 랜덤
function rollChestRarity(){
  const k = clamp(G.t / GOAL, 0, 1), r = Math.random();
  if (r < 0.50 - 0.35 * k) return "common";
  if (r < 0.85 - 0.25 * k) return "rare";
  return "epic";
}
function startChestSpin(){
  const evoId = G.chestData.evoId || null;
  const rarity = evoId ? "legendary" : rollChestRarity();
  const icons = Object.keys(WEAPONS).map(id => WEAPONS[id].icon);
  // 릴 최종 조합 = 희귀도 표현 (트리플=epic, 페어=rare, 노페어=common, 진화 아이콘 트리플=legendary)
  let finals;
  if (evoId){ const ic = EVO[evoId].icon; finals = [ic, ic, ic]; }
  else if (rarity === "epic"){ const ic = pick(icons); finals = [ic, ic, ic]; }
  else if (rarity === "rare"){
    const ic = pick(icons), o = pick(icons.filter(i => i !== ic));
    finals = Math.random() < 0.5 ? [ic, ic, o] : [ic, o, ic];
  } else finals = shuffle(icons.slice()).slice(0, 3);
  const reels = finals.map((fic, i) => {
    const strip = shuffle(evoId ? [...icons, EVO[evoId].icon] : icons.slice());
    const turns = 9 + i * 4, fin = strip.indexOf(fic); // 왼쪽 → 가운데 → 오른쪽 순 정지
    return { strip, turns, fin, start: ((fin - turns) % strip.length + strip.length) % strip.length,
             stopAt: 1250 + i * 375, landed: false, flashT: 0 };
  });
  spinFx = { t0: performance.now(), last: performance.now(), rarity, R: RARITY[rarity], evoId, reels,
             revealed: false, shake: 0, confetti: [] };
  setScene("chestspin");
}
function skipChestSpin(){ if (scene === "chestspin" && spinFx) finishChestSpin(); }
function finishChestSpin(){
  if (!spinFx || !G) return;
  spinFx = null;
  if (!G.chestApplied){ // 보상 확정 — 기존 chestAdvance 개봉 로직과 동일
    G.chestApplied = true;
    if (G.chestData.evoId){
      const w = owned(G.chestData.evoId);
      w.evolved = true; G.slotsDirty = true;
      G.effects.push({ type:"ring", x:G.p.x, y:G.p.y, r:140, t:0.6, max:0.6 });
      SFX.evo();
    } else {
      G.gold += G.chestData.gold;
      G.p.hp = Math.min(G.p.maxHp, G.p.hp + G.chestData.heal);
    }
  }
  metaCheck(); // BACKLOG #11: 진화/상자 업적 판정
  G.chestPhase = "open";
  setScene("chest"); // 기존 결과(무기 진화/재화) 화면으로 전환
}
// 오버레이 렌더: 타임스탬프 기반 (0-800ms 상자 확대 → 800-2000ms 릴 스핀 → 2000-2500ms 결과 플래시)
function drawChestSpin(now){
  const s = spinFx, el = now - s.t0;
  const dt = clamp((now - s.last) / 1000, 0, 0.05);
  s.last = now;
  const cx = vw / 2, cy = vh / 2, RR = s.R;
  // 배경 암전 (페이즈 1과 함께 진행)
  ctx.fillStyle = `rgba(8,5,16,${0.82 * clamp(el / 800, 0, 1)})`;
  ctx.fillRect(0, 0, vw, vh);
  ctx.save();
  ctx.translate((Math.random() - 0.5) * s.shake, (Math.random() - 0.5) * s.shake); // "thunk" 흔들림
  // ---- 페이즈 1: 상자가 화면 중앙으로 확대 (스프라이트 우선, 미로딩 시 이모지 폴백) ----
  if (el < 900){
    const p = clamp(el / 800, 0, 1), sz = 46 * lerp(1, 3.1, backOut(p));
    const a = clamp(1 - (el - 800) / 100, 0, 1);
    ctx.save(); ctx.globalAlpha = a;
    const gl = ctx.createRadialGradient(cx, cy, 8, cx, cy, sz * 1.7);
    gl.addColorStop(0, `rgba(232,182,76,${0.4 * a})`); gl.addColorStop(1, "rgba(232,182,76,0)");
    ctx.fillStyle = gl; ctx.fillRect(cx - sz * 1.7, cy - sz * 1.7, sz * 3.4, sz * 3.4);
    const cimg = SPRITES["item-chest"];
    if (spriteReady(cimg)){ ctx.imageSmoothingEnabled = false; ctx.drawImage(cimg, cx - sz, cy - sz, sz * 2, sz * 2); }
    else emoji("🎁", cx, cy, sz * 1.5);
    ctx.restore();
  } else if (el < 1150){ // 개봉 링 버스트
    const q = (el - 800) / 350;
    ctx.strokeStyle = `rgba(255,224,138,${0.8 * (1 - q)})`; ctx.lineWidth = 6 * (1 - q) + 1;
    ctx.beginPath(); ctx.arc(cx, cy, 30 + q * 190, 0, TAU); ctx.stroke();
  }
  // ---- 페이즈 2: 슬롯 릴 3개 (감속 스핀, 왼쪽부터 차례 정지 + thunk 흔들림) ----
  const rw = Math.min(106, vw * 0.23), rh = 96, gap = 14, pad = 16;
  const mw = rw * 3 + gap * 2, mh = rh + pad * 2;
  const mx = cx - mw / 2, my = cy - mh / 2 + 14;
  if (el >= 800){
    const sc = backOut(clamp((el - 800) / 240, 0, 1));
    ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc); ctx.translate(-cx, -cy);
    ctx.fillStyle = "rgba(34,26,51,0.96)"; // 머신 패널
    ctx.beginPath(); ctx.roundRect(mx - pad, my - pad, mw + pad * 2, mh, 16); ctx.fill();
    ctx.strokeStyle = s.revealed ? RR.col : "#4a3a6b"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(mx - pad, my - pad, mw + pad * 2, mh, 16); ctx.stroke();
    for (let i = 0; i < 3; i++){
      const R = s.reels[i], rx = mx + i * (rw + gap);
      const p = clamp((el - 800) / (R.stopAt - 800), 0, 1);
      if (p >= 1 && !R.landed){ // 릴 정지 "thunk": 화면 흔들림 + 효과음
        R.landed = true; R.flashT = 1;
        s.shake = 7; G.shake = Math.min(10, G.shake + 4);
        tone(190, 55, 0.09, "square", 0.16);
        playSfx("powerup", { playbackRate: 1.2 + i * 0.15, volume: 0.28 });
      }
      ctx.save();
      ctx.beginPath(); ctx.roundRect(rx, my, rw, rh, 10); ctx.clip();
      ctx.fillStyle = "#171122"; ctx.fillRect(rx, my, rw, rh);
      const off = R.turns * (1 - Math.pow(1 - p, 3)); // easeOutCubic 감속 (정확히 정지 위치에 랜딩)
      const L = R.strip.length, frac = off % 1, base = (R.start + Math.floor(off)) % L, rowH = 60;
      for (let k = -1; k <= 1; k++)
        emoji(R.strip[((base + k) % L + L) % L], rx + rw / 2, my + rh / 2 + (k - frac) * rowH, 40);
      const eg = ctx.createLinearGradient(0, my, 0, my + rh); // 상하 페이드
      eg.addColorStop(0, "rgba(10,7,20,0.9)"); eg.addColorStop(0.5, "rgba(10,7,20,0)"); eg.addColorStop(1, "rgba(10,7,20,0.9)");
      ctx.fillStyle = eg; ctx.fillRect(rx, my, rw, rh);
      ctx.fillStyle = "rgba(232,182,76,0.08)"; ctx.fillRect(rx, my + rh / 2 - 30, rw, 60); // 센터 라인
      ctx.fillStyle = "rgba(232,182,76,0.55)";
      ctx.fillRect(rx, my + rh / 2 - 31, rw, 2); ctx.fillRect(rx, my + rh / 2 + 29, rw, 2);
      if (R.landed){ // 랜딩 플래시
        R.flashT = Math.max(0, R.flashT - dt * 4);
        ctx.fillStyle = `rgba(255,255,255,${0.55 * R.flashT})`; ctx.fillRect(rx, my, rw, rh);
      }
      ctx.restore();
      ctx.strokeStyle = "#4a3a6b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(rx, my, rw, rh, 10); ctx.stroke();
    }
    ctx.restore();
  }
  // ---- 페이즈 3: 최종 리빌 (희귀도 색 글로우 + rare 이상 컨페티) ----
  if (el >= 2000 && !s.revealed){
    s.revealed = true;
    playSfx("powerup", { playbackRate: 0.8, volume: 0.5 }); // 최종 리빌: 저재생 속도로 무게감
    tone(520, 1180, 0.3, "triangle", 0.14);
    if (s.rarity !== "common"){
      const n = s.rarity === "legendary" ? 90 : s.rarity === "epic" ? 60 : 45;
      const cols = [RR.col, "#ffd76a", "#ffffff", "#7fd0ff", "#ff8ac0"];
      for (let i = 0; i < n; i++)
        s.confetti.push({ x: cx + rand(-mw / 2, mw / 2), y: my, vx: rand(-240, 240), vy: rand(-560, -160),
                          rot: rand(0, TAU), vr: rand(-9, 9), w: rand(5, 9), h: rand(9, 15), t: rand(1, 1.7), col: pick(cols) });
    }
  }
  if (s.revealed){
    const rp = clamp((el - 2000) / 400, 0, 1), pulse = 0.6 + 0.4 * Math.sin(el * 0.012);
    const gr = Math.max(vw, vh) * (0.25 + 0.3 * rp);
    const gg = ctx.createRadialGradient(cx, cy, 30, cx, cy, gr);
    gg.addColorStop(0, `rgba(${RR.rgb},${0.34 * pulse * rp})`); gg.addColorStop(1, `rgba(${RR.rgb},0)`);
    ctx.fillStyle = gg; ctx.fillRect(0, 0, vw, vh);
    const lp = clamp((el - 2020) / 260, 0, 1), ls = 0.6 + 0.4 * backOut(lp); // 희귀도 라벨
    ctx.save(); ctx.translate(cx, my + mh + 52); ctx.scale(ls, ls); ctx.globalAlpha = lp;
    ctx.font = "900 42px sans-serif"; ctx.textAlign = "center";
    ctx.fillStyle = "rgba(0,0,0,0.65)"; ctx.fillText(`★ ${RR.label} ★`, 2, 2);
    ctx.fillStyle = RR.col; ctx.fillText(`★ ${RR.label} ★`, 0, 0);
    ctx.font = "800 14px sans-serif"; ctx.fillStyle = "rgba(236,230,247,0.85)";
    ctx.fillText(s.evoId ? `${WEAPONS[s.evoId].name} → ${EVO[s.evoId].name}` : "골드와 체력을 획득!", 0, 30);
    ctx.restore();
  }
  for (let i = s.confetti.length - 1; i >= 0; i--){ // 컨페티 (화면 좌표 파티클)
    const c = s.confetti[i];
    c.t -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 780 * dt; c.rot += c.vr * dt;
    if (c.t <= 0 || c.y > vh + 24){ s.confetti.splice(i, 1); continue; }
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.globalAlpha = clamp(c.t, 0, 1);
    ctx.fillStyle = c.col; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  s.shake = Math.max(0, s.shake - dt * 30);
  ctx.font = "800 12px sans-serif"; ctx.textAlign = "center"; // 스킵 힌트
  ctx.fillStyle = "rgba(169,156,196,0.75)";
  ctx.fillText("클릭 또는 아무 키 — 건너뛰기", cx, vh - 24);
  ctx.restore();
  if (el >= 2500) finishChestSpin(); // 연출 종료 → 기존 결과 화면
}

/* ---------------- 씬 관리 ---------------- */
function setScene(s){
  scene = s;
  const inRun = s === "play" || s === "levelup" || s === "chest" || s === "chestspin" || s === "pause";
  $("hud").classList.toggle("hidden", !inRun);
  for (const el of document.querySelectorAll(".screen")) el.classList.add("hidden");
  if (s === "play") { /* 화면 없음 */ }
  else if (s === "char"){ buildChar(); $("scr-char").classList.remove("hidden"); }
  else if (s === "meta"){ buildMeta(); $("scr-meta").classList.remove("hidden"); } // BACKLOG #11: 업적 목록
  else if (s === "levelup"){ G.hitstop = 0; buildLevelUp(); $("scr-levelup").classList.remove("hidden"); }
  else if (s === "chest"){ G.hitstop = 0; buildChest(); $("scr-chest").classList.remove("hidden"); }
  else if (s === "pause"){ buildPause(); $("scr-pause").classList.remove("hidden"); }
  else if (s === "over" || s === "win"){ stopBgm(); buildEnd(s); $("scr-end").classList.remove("hidden"); }
  else if (s === "title"){ stopBgm(); $("scr-title").classList.remove("hidden"); }
}
function buildChar(){
  const grid = $("chargrid");
  grid.innerHTML = "";
  // BACKLOG #11: 메타 보너스 칩 + 정복자 시작 무기 선택
  $("metaChips").innerHTML = metaChipHtml() || `<span class="chip off">언락된 보너스 없음 — 업적 달성 시 해금</span>`;
  const wp = $("wpick");
  if (META.achievements.includes("conquer")){
    wp.classList.remove("hidden");
    let h = `<div class="wptitle">🏁 시작 무기 선택 <span>(정복자 언락 · 미선택 시 캐릭터 기본)</span></div><div class="wplist">`;
    h += `<span class="wchip${metaStartWeapon ? "" : " sel"}" data-w="">기본</span>`;
    for (const id of Object.keys(WEAPONS))
      h += `<span class="wchip${metaStartWeapon === id ? " sel" : ""}" data-w="${id}">${WEAPONS[id].icon} ${WEAPONS[id].name}</span>`;
    wp.innerHTML = h + `</div>`;
    for (const b of wp.querySelectorAll(".wchip"))
      b.addEventListener("click", () => { metaStartWeapon = b.dataset.w || null; SFX.pick(); buildChar(); });
  } else { wp.classList.add("hidden"); wp.innerHTML = ""; }
  for (const id of Object.keys(CHARS)){
    const c = CHARS[id], w = WEAPONS[c.weapon];
    const el = document.createElement("div");
    el.className = "charcard";
    el.innerHTML = `<canvas class="cprev" width="144" height="150"></canvas>
                    <div class="cn">${c.name}</div><div class="cd">${c.desc}</div>
                    <div class="cw">시작 무기 ${w.icon} ${w.name}</div>`;
    el.addEventListener("click", () => { newGame(id); setScene("play"); startBgm(); banner("생존하라!", "10분 동안 버텨라 — 이동: WASD/드래그", 3200); });
    grid.appendChild(el);
    const pc = el.querySelector("canvas").getContext("2d");
    pc.fillStyle = "rgba(255,255,255,0.06)";
    pc.beginPath(); pc.arc(36, 44, 28, 0, TAU); pc.fill();
    drawHero(pc, id, 36, 46, 1, 0.8, false, 1.3);
  }
}
function buildPause(){
  let h = "";
  for (const w of G.weapons){
    const ic = w.evolved ? EVO[w.id].icon : WEAPONS[w.id].icon;

let vignette = null;
function resize(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  vw = window.innerWidth; vh = window.innerHeight;
  canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + "px"; canvas.style.height = vh + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  vignette = document.createElement("canvas");
  vignette.width = vw; vignette.height = vh;
  const vctx = vignette.getContext("2d");
  const g = vctx.createRadialGradient(vw/2, vh/2, Math.min(vw,vh)*0.36, vw/2, vh/2, Math.max(vw,vh)*0.72);
  g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.55)");
  vctx.fillStyle = g; vctx.fillRect(0, 0, vw, vh);
}
window.addEventListener("resize", resize);

function circle(x, y, r){ ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ellipse(x, y, rx, ry){ ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); ctx.fill(); }
function emoji(ch, x, y, size, rot){
  ctx.save(); ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  ctx.font = size + "px serif";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(ch, 0, 0);
  ctx.restore();
}
const CELL = 140;
function drawFloor(){
  const x0 = Math.floor((G.cam.x - vw/2) / CELL) - 1, x1 = Math.floor((G.cam.x + vw/2) / CELL) + 1;
  const y0 = Math.floor((G.cam.y - vh/2) / CELL) - 1, y1 = Math.floor((G.cam.y + vh/2) / CELL) + 1;
  for (let cy = y0; cy <= y1; cy++){
    for (let cx = x0; cx <= x1; cx++){
      ctx.fillStyle = (cx + cy) % 2 ? "#191329" : "#1b1530";
      ctx.fillRect(cx * CELL, cy * CELL, CELL, CELL);
      const h = hash2(cx * 3 + 7, cy * 3 + 11);
      const px = cx * CELL + hash2(cx, cy * 5) * 90 + 25;
      const py = cy * CELL + hash2(cx * 5, cy) * 90 + 25;
      if (h < 0.035){ // 죽은 나무
        ctx.strokeStyle = "#241c3a"; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(px, py + 26); ctx.lineTo(px, py - 16);
        ctx.moveTo(px, py - 4); ctx.lineTo(px - 13, py - 18);
        ctx.moveTo(px, py - 10); ctx.lineTo(px + 12, py - 24); ctx.stroke();
      } else if (h < 0.07){ // 묘비
        ctx.fillStyle = "#2c2542";
        ctx.beginPath(); ctx.roundRect(px - 9, py - 14, 18, 26, 7); ctx.fill();
        ctx.fillRect(px - 13, py + 10, 26, 5);
        ctx.fillStyle = "#221b38"; ctx.fillRect(px - 2, py - 8, 4, 12); ctx.fillRect(px - 5, py - 5, 10, 4);
      } else if (h < 0.1){ // 바위
        ctx.fillStyle = "#2a2344";
        ctx.beginPath(); ctx.moveTo(px - 12, py + 8); ctx.lineTo(px - 6, py - 9); ctx.lineTo(px + 7, py - 7);
        ctx.lineTo(px + 13, py + 8); ctx.closePath(); ctx.fill();
      } else if (h < 0.14){ // 수풀
        ctx.fillStyle = "#1d2c25";
        circle(px - 6, py, 7); circle(px + 4, py - 3, 8); circle(px + 8, py + 3, 6);
      }
    }
  }
}
function drawGarlic(){

function drawPools(){
  for (const p of G.pools){

    circle(p.x, p.y, p.r);
    ctx.strokeStyle = "rgba(154,110,255,0.55)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.stroke();
    for (let i = 0; i < 3; i++){
      const a = G.animT * 2 + i * 2.1 + p.x;
      const bx = p.x + Math.cos(a) * p.r * 0.5, by = p.y + Math.sin(a * 1.3) * p.r * 0.4;
      ctx.fillStyle = "rgba(200,160,255,0.4)";

function gemColor(v){ return v >= 100 ? "#ffd24a" : v >= 30 ? "#ff6b6b" : v >= 8 ? "#66ff9c" : "#4db8ff"; }
function drawGems(){
  for (const g of G.gems){
    const bob = Math.sin(G.animT * 4 + g.ph) * 2;
    const gimg = SPRITES["item-gem"];
    if (spriteReady(gimg)){
      const s = g.v >= 30 ? 22 : 16;
      ctx.drawImage(gimg, g.x - s / 2, g.y + bob - s / 2, s, s);
      continue;
    }
    ctx.save(); ctx.translate(g.x, g.y + bob); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = gemColor(g.v);
    const s = g.v >= 30 ? 7 : 5;
    ctx.fillRect(-s, -s, s * 2, s * 2);
    ctx.fillStyle = "rgba(255,255,255,0.75)";
    ctx.fillRect(-s + 2, -s + 2, 2, 2);
    ctx.restore();
  }
}
function drawPickups(){
  for (const k of G.pickups){
    const bob = Math.sin(G.animT * 3 + (k.ph || 0)) * 3;
    if (k.kind === "chest"){
      const gl = 0.25 + 0.15 * Math.sin(G.animT * 5);

    // BACKLOG #8: 치유 아이템(chicken)도 물약 스프라이트 렌더 — 26px 유지, 미로딩 시 기존 이모지 폴백
    const cimg = k.kind === "chest" ? SPRITES["item-chest"] : k.kind === "chicken" ? SPRITES["item-potion"] : null;
    const csz = k.kind === "chest" ? 44 : 26;
    if (spriteReady(cimg)){
      ctx.save(); ctx.imageSmoothingEnabled = false;
      ctx.drawImage(cimg, k.x - csz / 2, k.y + bob - csz / 2, csz, csz);
      ctx.restore();
    } else
      emoji(k.kind === "chest" ? "🎁" : k.kind === "magnet" ? "🧲" : k.kind === "chicken" ? "🍗" : "💣",
            k.x, k.y + bob, k.kind === "chest" ? 34 : 26);

  wolf(g, s, t){

    g.beginPath(); g.moveTo(s * 0.72, -s * 0.7 + run); g.lineTo(s * 0.8, -s * 1.05 + run); g.lineTo(s * 0.98, -s * 0.62 + run); g.closePath(); dFS(g);
    dOut(g, "#c8d0e0"); dEEll(g, s * 0.98, -s * 0.22 + run, s * 0.22, s * 0.15);

    dOut(g, "#8f8ba8"); dRR(g, -s * 0.8, -s * 0.35 + br, s * 1.6, s * 1.2, s * 0.3);
    dOut(g, "#a09cb8"); dEEll(g, 0, -s * 0.45 + br, s * 0.55, s * 0.3);
    g.fillStyle = "#5fae4a";
    dEll(g, -s * 0.25, -s * 0.55 + br, s * 0.2, s * 0.09);

    dEll(g, -s * 0.22, -s * 0.05 + br, s * 0.1, s * 0.13);
    dEll(g, s * 0.22, -s * 0.05 + br, s * 0.1, s * 0.13);

  slimeking(g, s, t){ MOB_DRAW.slime(g, s, t, null, true); },
  shroomking(g, s, t){ MOB_DRAW.shroom(g, s, t, null, true); },
  reaper(g, s, t){

    dEll(g, -s * 0.08, -s * 0.3, s * 0.09, s * 0.13);
    dEll(g, s * 0.22, -s * 0.3, s * 0.09, s * 0.13);
  },
};
/* AI 생성 몬스터 스프라이트 ↔ 적 타입 매핑 (매칭 없는 타입·보스는 기존 벡터 드로잉 사용) */
const ENEMY_SPRITE = { wolf:"enemy-hunter", shroom:"enemy-mage", ghost:"enemy-nun", stump:"enemy-warrior", golem:"enemy-paladin", slime:"enemy-alchemist", snail:"enemy-snail", bat:"enemy-bat", pig:"enemy-pig", slimeking:"boss-slimeking", shroomking:"boss-shroomking", reaper:"boss-reaper" };
function drawEnemy(e){
  const t = G.animT + e.phase;
  const wob = e.wob ? Math.sin(G.animT * 6 + e.phase) * 4 : 0;
  ctx.fillStyle = "rgba(0,0,0,0.27)";
  ellipse(e.x + wob, e.y + e.r * 0.9, e.r * 0.85, e.r * 0.3);
  if (e.elite || e.boss){
    ctx.fillStyle = "rgba(255,60,60,0.16)";
    circle(e.x + wob, e.y, e.r * 1.5);
  }
  const f = G.p.x >= e.x ? 1 : -1;
  ctx.save();
  ctx.translate(e.x + wob, e.y);
  ctx.scale(f, 1);
  const simg = SPRITES[ENEMY_SPRITE[e.type]];
  if (spriteReady(simg)){
    const s = e.r * 2.6;
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(simg, -s / 2, -s / 2, s, s);
  } else (MOB_DRAW[e.type] || MOB_DRAW.slime)(ctx, e.r, t, e);
  ctx.restore();
  if (e.flash > 0){
    ctx.fillStyle = `rgba(255,255,255,${Math.min(0.6, e.flash * 5)})`;
    circle(e.x + wob, e.y, e.r * 0.85);
  }
}
/* ---------- 메이플풍 치비 드로잉 (오리지널 무료 아트, 외부 에셋 0) ---------- */
const OUT = "rgba(38,26,58,0.9)";
function dOut(g, col, lw){ g.fillStyle = col; g.strokeStyle = OUT; g.lineWidth = lw || 2; }
function dFS(g){ g.fill(); g.stroke(); }
function dCir(g, x, y, r){ g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function dEll(g, x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); }
function dECir(g, x, y, r){ g.beginPath(); g.arc(x, y, r, 0, TAU); dFS(g); }
function dEEll(g, x, y, rx, ry){ g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); dFS(g); }
function dRR(g, x, y, w, h, r){ g.beginPath(); g.roundRect(x, y, w, h, r); dFS(g); }
function dEyes(g, x, y, s){
  g.fillStyle = "#2a1f33";
  dEll(g, x - s, y, s * 0.34, s * 0.55);
  dEll(g, x + s, y, s * 0.34, s * 0.55);
  g.fillStyle = "#fff";
  dCir(g, x - s + s * 0.13, y - s * 0.2, s * 0.12);
  dCir(g, x + s + s * 0.13, y - s * 0.2, s * 0.12);
}
function dAngry(g, x, y, s){
  g.strokeStyle = "#2a1f33"; g.lineWidth = 2.2; g.lineCap = "round";
  g.beginPath();
  g.moveTo(x - s * 1.55, y - s * 0.55); g.lineTo(x - s * 0.45, y - s * 0.05);
  g.moveTo(x + s * 1.55, y - s * 0.55); g.lineTo(x + s * 0.45, y - s * 0.05);
  g.stroke();
}
function dSmile(g, x, y, r){
  g.strokeStyle = "#2a1f33"; g.lineWidth = 1.8; g.lineCap = "round";
  g.beginPath(); g.arc(x, y, r, 0.2, Math.PI - 0.2); g.stroke();
}
function dBlush(g, x, y, s){ g.fillStyle = "rgba(255,130,140,0.4)"; dEll(g, x, y, s, s * 0.55); }
function dCrown(g, x, y, w){
  const h = w * 0.6;
  dOut(g, "#f2c14e");
  g.beginPath();
  g.moveTo(x - w / 2, y);
  g.lineTo(x - w / 2, y - h * 0.55);
  g.lineTo(x - w / 6, y - h * 0.25);
  g.lineTo(x, y - h);
  g.lineTo(x + w / 6, y - h * 0.25);
  g.lineTo(x + w / 2, y - h * 0.55);
  g.lineTo(x + w / 2, y);
  g.closePath(); dFS(g);
  g.fillStyle = "#e0483f"; dCir(g, x, y - h * 0.15, w * 0.09);
}
/* 캐릭터별 모자 */
function drawHat(g, S, hx, hy){
  switch (S.hat){
    case "brim": // 사냥꾼 모자
      dOut(g, S.hatCol);
      dEEll(g, hx, hy, 13.5, 3.6);
      dRR(g, hx - 6.5, hy - 9.5, 13, 9.5, 3.5);
      g.fillStyle = S.accent; g.fillRect(hx - 6.5, hy - 3.6, 13, 2.8);
      break;
    case "wizard": // 마법사 뾰족모자
      dOut(g, S.hatCol);
      dEEll(g, hx, hy + 1, 12.5, 3.4);
      g.beginPath();
      g.moveTo(hx - 7.5, hy);
      g.quadraticCurveTo(hx - 1, hy - 11, hx + 9, hy - 19);
      g.quadraticCurveTo(hx + 1, hy - 9, hx + 7.5, hy);
      g.closePath(); dFS(g);
      g.fillStyle = S.accent; dCir(g, hx + 8.2, hy - 18.4, 2.6);
      break;
    case "veil": // 수녀 베일
      dOut(g, S.hatCol);
      g.beginPath();
      g.arc(hx, hy - 2.5, 12, Math.PI * 1.03, Math.PI * 1.97);
      g.quadraticCurveTo(hx, hy + 3.5, hx - 11.6, hy - 3.8);
      g.closePath(); dFS(g);
      g.fillStyle = S.accent; g.fillRect(hx - 11.8, hy - 3.6, 23.6, 2);
      break;
    case "helm": // 전사 투구
      dOut(g, S.hatCol);
      g.beginPath(); g.arc(hx, hy - 0.5, 11.8, Math.PI, 0); g.closePath(); dFS(g);
      g.fillStyle = S.accent; g.fillRect(hx - 11.8, hy - 2.2, 23.6, 2.6);
      g.fillStyle = "#dfe8f5"; dRR(g, hx - 1.4, hy - 9, 2.8, 7, 1.4);
      break;
    case "circlet": // 성기사 서약반지
      g.strokeStyle = S.hatCol; g.lineWidth = 2.6; g.lineCap = "round";
      g.beginPath(); g.arc(hx, hy + 3, 10.8, Math.PI * 1.18, Math.PI * 1.82); g.stroke();
      g.fillStyle = S.accent; dCir(g, hx, hy - 7.4, 2.4);
      break;
    case "goggles": // 연금술사 고글
      g.strokeStyle = S.hatCol; g.lineWidth = 2.2; g.lineCap = "round";
      g.beginPath(); g.moveTo(hx - 10.5, hy + 1.5); g.quadraticCurveTo(hx, hy - 4, hx + 10.5, hy + 1.5); g.stroke();
      dOut(g, "#b8e8ff", 2);
      dECir(g, hx - 5, hy + 1, 3.7);
      dECir(g, hx + 5, hy + 1, 3.7);
      g.fillStyle = "rgba(255,255,255,0.55)";
      dCir(g, hx - 5.8, hy, 1.1); dCir(g, hx + 4.2, hy, 1.1);
      break;
  }
}
/* 치비 캐릭터 리그: 큰 머리 + 작은 몸 (g=ctx, scale로 크기 조절) */
function drawHero(g, id, x, y, face, anim, moving, scale){
  const S = HERO_STYLE[id] || HERO_STYLE.hunter;
  scale = scale || 1;
  const bob = moving ? Math.sin(anim * 11) * 2 : Math.sin(anim * 2.2) * 1;
  g.save(); g.translate(x, y + bob); g.scale(face * scale, scale);
  // 다리
  const lp = moving ? Math.sin(anim * 11) * 3.5 : 0;
  g.fillStyle = S.pants;
  dEll(g, -4.5, 15 + Math.max(0, lp), 3.6, 5);
  dEll(g, 4.5, 15 - Math.min(0, lp), 3.6, 5);
  // 팔
  dOut(g, S.outfit);
  dEll(g, -10, 1.5 + (moving ? Math.sin(anim * 11) * 1.5 : 0), 2.7, 4.6);
  dEll(g, 10, 1.5 - (moving ? Math.sin(anim * 11) * 1.5 : 0), 2.7, 4.6);
  // 몸
  dRR(g, -9, -5, 18, 20, 7);
  g.fillStyle = S.trim; g.fillRect(-9, 5, 18, 3);
  // 머리 (크게!)
  dOut(g, S.skin); dCir(g, 0.5, -15, 12);
  // 머리카락 (뒤 + 앞머리)
  g.fillStyle = S.hair;
  g.beginPath(); g.arc(0.5, -16.5, 12.2, Math.PI * 0.88, Math.PI * 2.12); g.fill();
  g.beginPath();
  g.moveTo(-11.6, -16);
  g.quadraticCurveTo(-7, -23, 4, -22.5);
  g.quadraticCurveTo(12, -21.5, 11.8, -12);
  g.quadraticCurveTo(8, -18, 1, -16.5);
  g.quadraticCurveTo(-5, -15.5, -11.6, -16);
  g.closePath(); g.fill();
  // 얼굴
  dEyes(g, 3.2, -11, 3.4);
  dSmile(g, 4.2, -6.2, 2.1);
  dBlush(g, -5.5, -8.5, 2.2);
  drawHat(g, S, 0.5, -25);
  g.restore();
}
function drawPlayer(){

function drawBooks(){

function drawEffects(){
  for (const e of G.effects){
    const k = e.t / e.max;
    if (e.type === "slash"){
      ctx.save(); ctx.translate(e.x, e.y); ctx.scale(e.dir, 1);
      ctx.strokeStyle = `rgba(255,240,215,${0.9 * k})`;

      ctx.beginPath(); ctx.arc(-40, 0, 85 * e.area, -1, 1); ctx.stroke();
      ctx.restore();

      const rr = e.r * (1 - k * k);
      ctx.strokeStyle = `rgba(255,220,140,${0.8 * k})`;

function drawParticles(){

  if (G.p.hp < G.p.maxHp * 0.3){
    ctx.fillStyle = `rgba(255,40,40,${0.10 + 0.06 * Math.sin(now * 0.008)})`;
    ctx.fillRect(0, 0, vw, vh);
  }
  if (spinFx) drawChestSpin(now); // BACKLOG #5: 슬롯머신 상자 연출 (최상단 캔버스 오버레이)
}

/* ---------------- 메인 루프 ---------------- */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.045, (now - last) / 1000) || 0;
  last = now;
  if (scene === "play" && G) update(dt);
  render(now);
}

/* ---------------- 버튼 ---------------- */
$("btnStart").addEventListener("click", () => setScene("char"));
$("btnMeta").addEventListener("click", () => setScene("meta"));       // BACKLOG #11: 업적 목록
$("btnMetaClose").addEventListener("click", () => setScene("title")); // BACKLOG #11: 업적 화면 닫기
$("btnPause").addEventListener("click", () => { if (scene === "play") setScene("pause"); });
$("btnMute").addEventListener("click", toggleMute);
$("btnResume").addEventListener("click", () => setScene("play"));
$("btnQuit").addEventListener("click", () => { G = null; setScene("title"); });
$("btnChest").addEventListener("click", chestAdvance);
$("btnReroll").addEventListener("click", doReroll);
$("btnSkip").addEventListener("click", doSkip);
$("btnRetry").addEventListener("click", () => { G = null; setScene("char"); });
$("btnHome").addEventListener("click", () => { G = null; setScene("title"); });

/* ---------------- 시작 ---------------- */
resize();
setScene("title");
requestAnimationFrame(frame);
</script>
</body>
</html>
