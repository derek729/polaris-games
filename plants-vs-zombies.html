<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 식물 vs 좀비 🧟</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
<style>
  html,body{margin:0;padding:0;background:#16240f;height:100%;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
       font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;}
  canvas{display:block;max-width:100vw;height:auto;border-radius:10px;
         box-shadow:0 12px 40px rgba(0,0,0,.6);cursor:pointer;}
</style>
</head>
<body>
<canvas id="game" width="1000" height="650"></canvas>
<script>
"use strict";
/* ============================================================
   🌻 식물 vs 좀비 (Plants vs. Zombies 스타일 웹 클론)
   - 단일 HTML 파일, 외부 에셋 없음 (전부 캔버스 드로잉)
   ============================================================ */
window.__errors = [];
window.addEventListener("error", e => __errors.push(e.message));

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const W = 1000, H = 650;
const GRID = { x: 60, y: 130, cols: 9, rows: 5, cw: 100, ch: 100 };
const MOWER_X = 44, HOUSE_X = 10;

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

/* ---------------- 스프라이트 (선택 PNG 에셋, 로드 실패 시 기존 드로잉 사용) ---------------- */
const SPRITES = {};
["plant-sunflower", "plant-peashooter", "plant-snowpea", "plant-repeater",
 "plant-cherry", "plant-wallnut",
 "zombie-basic", "zombie-cone", "zombie-bucket", "zombie-flag",
 "zombie-thrower", "zombie-runner"].forEach(n => {
  const img = new Image();
  img.src = "game-assets/pvz/" + n + ".png";
  SPRITES[n] = img;
});
const ZSPRITE = { normal: "zombie-basic", cone: "zombie-cone", bucket: "zombie-bucket", flag: "zombie-flag",
                  thrower: "zombie-thrower", runner: "zombie-runner" };

/* ---------------- 데이터 정의 ---------------- */
const PTYPES = ["sunflower", "peashooter", "snowpea", "repeater", "wallnut", "cherry"];
const PLANTS = {
  sunflower:  { name: "해바라기",   cost: 50,  hp: 300,  cd: 5,  desc: "태양을 생성한다" },
  peashooter: { name: "완두 슈터", cost: 100, hp: 300,  cd: 5,  desc: "완두콩을 발사한다" },
  snowpea:    { name: "얼음 완두", cost: 175, hp: 300,  cd: 8,  desc: "적을 얼려 둔하게 한다" },
  repeater:   { name: "더블 완두", cost: 200, hp: 300,  cd: 8,  desc: "완두콩 2발 발사" },
  wallnut:    { name: "호두 방벽", cost: 50,  hp: 2400, cd: 20, desc: "튼튼한 방어벽" },
  cherry:     { name: "체리 폭탄", cost: 150, hp: 9999, cd: 25, desc: "3x3 범위 폭발!" },
};
const ZTYPES = {
  normal:  { hp: 190,  spd: 16 },
  cone:    { hp: 560,  spd: 16 },
  bucket:  { hp: 1250, spd: 15 },
  flag:    { hp: 200,  spd: 24 },
  thrower: { hp: 340,  spd: 12 },  // 화병 투척형: 사거리 내 정지 후 2.2초마다 투척 (2.2)
  runner:  { hp: 160,  spd: 46 },  // 질주형: 일반의 약 2.9배 속도 (2.2)
};
const WAVES = [
  { t: 20,  z: ["normal"] },
  { t: 50,  z: ["normal", "normal"] },
  { t: 80,  z: ["normal", "runner"] },                                        // 러너 첫 등장 (교육)
  { t: 110, z: ["cone", "normal", "normal"] },
  { t: 140, z: ["thrower", "cone", "normal"] },                               // 투척형 첫 등장 (교육)
  { t: 170, z: ["bucket", "thrower", "cone", "normal"] },
  { t: 200, z: ["runner", "runner", "bucket", "cone", "normal"] },            // 러너 시험
  { t: 230, z: ["bucket", "bucket", "thrower", "cone", "normal", "normal"] },
  { t: 258, z: ["bucket", "thrower", "thrower", "cone", "cone", "runner", "normal"] },  // 복합 시험
  { t: 285, final: true, z: ["flag", "bucket", "bucket", "thrower", "thrower", "cone", "cone", "runner", "runner", "normal", "normal", "normal"] },
];
const FINAL_T = WAVES[WAVES.length - 1].t;

/* ---------------- 사운드 (WebAudio) ---------------- */
let AC = null, muted = false;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch (e) { /* 사운드 미지원 환경 */ }
  return AC;
}
function tone(f1, f2, dur, type, vol) {
  if (muted) return;
  try {
    const a = ac(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g).connect(a.destination);
    o.start(); o.stop(a.currentTime + dur);
  } catch (e) { /* 무시 */ }
}
const SFX = {
  plant:  () => tone(180, 80, 0.14, "triangle", 0.25),
  shoot:  () => tone(520, 300, 0.06, "square", 0.07),
  splat:  () => tone(240, 110, 0.05, "square", 0.1),
  sun:    () => tone(880, 1500, 0.16, "sine", 0.14),
  eat:    () => tone(130, 70, 0.09, "sawtooth", 0.1),
  boom:   () => tone(130, 28, 0.5, "sawtooth", 0.4),
  mower:  () => tone(80, 240, 0.55, "sawtooth", 0.25),
  wave:   () => tone(300, 150, 0.3, "triangle", 0.18),
  warn:   () => tone(700, 180, 0.4, "sawtooth", 0.3),   // 최종 웨이브 사전 경고 (2.1)
  throw:  () => tone(300, 120, 0.12, "triangle", 0.15), // 화병 투척 (2.2)
  burst:  () => { tone(600, 120, 0.3, "square", 0.25); tone(900, 1500, 0.2, "sine", 0.2); }, // 태양 광폭 (2.3)
  nope:   () => tone(160, 120, 0.08, "square", 0.1),
  lose:   () => tone(320, 55, 1.2, "sawtooth", 0.3),
  win:    () => { tone(523, 523, 0.12, "triangle", 0.2);
                  setTimeout(() => tone(659, 659, 0.12, "triangle", 0.2), 130);
                  setTimeout(() => tone(784, 1046, 0.35, "triangle", 0.22), 260); },
};

/* ---------------- WAV 효과음 (sfx 파일 재생, 파일 없으면 무시) ---------------- */
const sfxWavLast = {};
function playSfx(name, opts) {
  opts = opts || {};
  try {
    if (muted) return;  // 기존 🔇 토글 존중
    const now = performance.now();
    if (opts.throttle && now - (sfxWavLast[name] || 0) < opts.throttle) return;
    sfxWavLast[name] = now;
    const a = new Audio("game-assets/sfx/" + name + ".wav");
    a.volume = opts.volume != null ? opts.volume : 0.4;
    if (opts.rate) a.playbackRate = opts.rate;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) { /* 파일 없음/미지원 환경 무시 */ }
}

/* ---------------- 게임 상태 ---------------- */
let game = null;
let shake = 0, lastEatSfx = 0, burstFlash = 0;  // burstFlash: 태양 광폭 화면 플래시 잔여시간 (2.3)
const BTN = {
  start: { x: 390, y: 430, w: 220, h: 54 },
  again: { x: 390, y: 430, w: 220, h: 54 },
  pause: { x: 940, y: 15, w: 46, h: 46 },
  mute:  { x: 940, y: 70, w: 46, h: 46 },
  shovel:{ x: 600, y: 15, w: 70, h: 100 },
  burst: { x: 690, y: 72, w: 236, h: 44 },  // 태양 광폭 버튼 — 미리보기 행(y 48~66)과 수직 분할 (2.3)
};

function newGame() {
  return {
    state: "menu",           // menu | playing | paused | won | lost
    sun: 150, time: 0,
    plants: [], zombies: [], peas: [], suns: [], particles: [], scorches: [],
    mowers: [], pending: [],
    cd: {}, selected: null, shovel: false,
    waveIdx: 0, sunTimer: 4, mx: -100, my: -100,
    finalWarned: false,           // 최종 웨이브 15초 전 경고 1회 플래그 (2.1)
    burst: 0, burstReady: false,  // 태양 광폭: 태양 수집 카운트(12회 = 1충전) / 완충 여부 (2.3)
  };
}
game = newGame();
for (const t of PTYPES) game.cd[t] = 0;
for (let r = 0; r < GRID.rows; r++) game.mowers.push({ row: r, x: 42, active: false, used: false, wheel: 0 });

/* ---------------- 유틸 ---------------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x1 - x2, y1 - y2);
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
const cellCX = c => GRID.x + c * GRID.cw + GRID.cw / 2;
const cellCY = r => GRID.y + r * GRID.ch + GRID.ch / 2;
function plantAt(c, r) { return game.plants.find(p => p.col === c && p.row === r && !p.dead) || null; }
function font(size, bold) { return (bold ? "bold " : "") + size + 'px "Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif'; }
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function rrect(x, y, w, h, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function text(str, x, y, size, color, bold, align) {
  ctx.font = font(size, bold !== false);
  ctx.fillStyle = color; ctx.textAlign = align || "center"; ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
}
function banner(text_, color, size, dur, y) {
  game.particles.push({ type: "banner", text: text_, color, size: size || 30, t: 0, dur: dur || 2, y: y == null ? 300 : y });
}
function toast(msg) { banner(msg, "#ffe08a", 20, 1.3, 158); }
function puff(x, y, n, colors, spd, life, g) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
    game.particles.push({
      type: "dot", x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - spd * 0.3,
      r: rand(2, 6), color: colors[(Math.random() * colors.length) | 0],
      t: 0, dur: rand(life * 0.6, life), g: g == null ? 260 : g,
    });
  }
}

/* ---------------- 엔티티 ---------------- */
class Plant {
  constructor(type, col, row) {
    const d = PLANTS[type];
    this.type = type; this.col = col; this.row = row;
    this.cx = cellCX(col); this.cy = cellCY(row);
    this.hp = d.hp; this.maxhp = d.hp;
    this.t = rand(0, 6); this.anim = rand(0, 6);
    this.shootT = rand(0.3, 1.2); this.sunT = rand(4, 7);
    this.recoil = 0; this.flashT = 0; this.dead = false;
  }
  update(dt) {
    this.anim += dt; this.t += dt;
    this.recoil = Math.max(0, this.recoil - dt * 5);
    this.flashT = Math.max(0, this.flashT - dt);
    if (this.type === "sunflower") {
      this.sunT -= dt;
      if (this.sunT <= 0) {
        this.sunT = rand(8.5, 11);
        spawnSun(this.cx + rand(-18, 18), this.cy - 20, false, this.cy + rand(6, 20));
        puff(this.cx, this.cy - 14, 6, ["#ffe66b", "#fff3ae"], 70, 0.5, 60);
      }
    } else if (this.type === "peashooter" || this.type === "snowpea" || this.type === "repeater") {
      const target = game.zombies.some(z => !z.dead && z.delayT <= 0 && z.row === this.row && z.x > this.cx - 20 && z.x < W + 10);
      if (target) {
        this.shootT -= dt;
        if (this.shootT <= 0) {
          this.shootT = 1.4; this.recoil = 1;
          if (this.type === "repeater") {
            game.peas.push(new Pea(this.cx + 24, this.cy - 12, this.row, this.type === "snowpea"));
            game.peas.push(new Pea(this.cx + 6, this.cy - 12, this.row, this.type === "snowpea"));
          } else {
            game.peas.push(new Pea(this.cx + 24, this.cy - 12, this.row, this.type === "snowpea"));
          }
          SFX.shoot();
        }
      } else this.shootT = Math.min(this.shootT, 0.4);
    } else if (this.type === "cherry") {
      if (this.t >= 1.1) {
        this.dead = true; this.exploded = true;
        for (const z of game.zombies) {
          if (!z.dead && Math.abs(z.x - this.cx) < 145 && Math.abs(z.y - this.cy) < 135) {
            z.hp -= 1800; z.flashT = 0.3;
            if (z.hp <= 0) killZombie(z);
          }
        }
        game.scorches.push({ x: this.cx, y: this.cy, t: 0, dur: 5 });
        puff(this.cx, this.cy, 36, ["#ff9d2e", "#ffd23e", "#ff5722", "#fff1c4"], 320, 0.9, 200);
        shake = 12; SFX.boom(); playSfx("explosion", { volume: 0.5 });
      }
    }
  }
}
class Pea {
  constructor(x, y, row, frozen, evil) {
    this.x = x; this.y = y + rand(-2, 2); this.row = row;
    this.frozen = frozen; this.evil = !!evil;
    this.vel = evil ? -240 : 330; this.dead = false;  // evil=화병: 우→좌 240px/s (2.2)
  }
  update(dt) {
    this.x += this.vel * dt;
    if (this.evil) {
      // 화병: 같은 행 식물과 충돌 (경로상 첫 식물 = 가장 오른쪽 식물), 명중 시 40 고정 피해
      for (const pl of game.plants) {
        if (pl.dead || pl.row !== this.row) continue;
        if (this.x < pl.cx + 22 && this.x > pl.cx - 18) {
          pl.hp -= 40; pl.flashT = 0.15;
          puff(this.x, this.y, 4, ["#b5854b", "#8d5a2b"], 90, 0.3, 300);
          SFX.splat(); playSfx("hit", { volume: 0.35, throttle: 300 });
          this.dead = true;
          if (pl.hp <= 0) {
            pl.dead = true;
            puff(pl.cx, pl.cy, 12, ["#7ec850", "#5da23a", "#a4d96a"], 150, 0.6);
          }
          break;
        }
      }
      if (this.x < -20) this.dead = true;
      return;
    }
    for (const z of game.zombies) {
      if (z.dead || z.delayT > 0 || z.row !== this.row) continue;
      if (this.x > z.x - 18 && this.x < z.x + 22) {
        z.hp -= 20; z.flashT = 0.12;
        if (this.frozen) z.slowT = 4;
        puff(this.x, this.y, 4, this.frozen ? ["#bde9ff", "#7fd0f2"] : ["#8ade5e", "#5cb832"], 90, 0.3, 300);
        SFX.splat();
        this.dead = true;
        if (z.hp <= 0) killZombie(z);
        break;
      }
    }
    if (this.x > W + 20) this.dead = true;
  }
}
class Zombie {
  constructor(type, row, delay) {
    const d = ZTYPES[type];
    this.type = type; this.row = row;
    this.x = W + 20 + rand(0, 30);
    this.y = GRID.y + row * GRID.ch + GRID.ch / 2 + 18;
    this.hp = d.hp; this.maxhp = d.hp; this.spd = d.spd;
    this.delayT = delay; this.slowT = 0; this.flashT = 0;
    this.thrT = rand(0.8, 1.6);  // 투척형 첫 투척 대기시간 (2.2)
    this.wob = rand(0, 6); this.eating = false; this.chomp = 0;
    this.dead = false; this.deathT = 0.9; this.eatSfxT = rand(0, 0.8);
  }
  update(dt) {
    if (this.dead) { this.deathT -= dt; return; }
    if (this.hp <= 0) { killZombie(this); return; }
    if (this.delayT > 0) { this.delayT -= dt; return; }
    this.wob += dt;
    this.flashT = Math.max(0, this.flashT - dt);
    if (this.slowT > 0) this.slowT -= dt;
    const mul = this.slowT > 0 ? 0.45 : 1;
    // 투척형: 사거리 260px(2.5칸) 내 가장 가까운(가장 오른쪽) 식물에 정지 후 화병 투척 (2.2)
    if (this.type === "thrower") {
      let tp = null;
      for (const pl of game.plants) {
        if (pl.dead || pl.row !== this.row || pl.type === "cherry") continue;  // 체리(자폭)는 대상 제외
        if (pl.cx < this.x && this.x - pl.cx <= 260 && (!tp || pl.cx > tp.cx)) tp = pl;
      }
      if (tp) {
        this.eating = false;
        this.thrT -= dt * mul;  // 얼림 시 투척 간격도 둔해짐
        if (this.thrT <= 0) {
          this.thrT = 2.2;  // 2.2초마다 투척
          game.peas.push(new Pea(this.x - 20, this.y - 30, this.row, false, true));
          SFX.throw(); playSfx("throw");
        }
        return;  // 이동 정지 — 대상이 죽어 사거리 밖이 되면 다시 보행
      }
    }
    let target = null;
    for (const pl of game.plants) {
      if (pl.dead || pl.row !== this.row) continue;
      if (pl.type === "cherry") continue;
      if (this.x >= pl.cx - 42 && this.x <= pl.cx + 48) { target = pl; break; }
    }
    if (target) {
      this.eating = true; this.chomp += dt;
      target.hp -= 62 * mul * dt; target.flashT = 0.15;
      this.eatSfxT -= dt;
      if (this.eatSfxT <= 0) { this.eatSfxT = 0.8; SFX.eat(); playSfx("hit", { volume: 0.35, throttle: 300 }); }
      if (target.hp <= 0) {
        target.dead = true;
        puff(target.cx, target.cy, 12, ["#7ec850", "#5da23a", "#a4d96a"], 150, 0.6);
      }
    } else {
      this.eating = false;
      this.x -= this.spd * mul * dt;
    }
    if (this.x < MOWER_X + 8) {
      const m = game.mowers[this.row];
      if (m && !m.used) { m.used = true; m.active = true; shake = Math.max(shake, 5); SFX.mower(); }
      else if (this.x < HOUSE_X) { loseGame(); }
    }
  }
}
class Sun {
  constructor(x, y, fromSky, targetY) {
    this.x = x; this.y = fromSky ? -30 : y;
    this.targetY = targetY == null ? y : targetY;
    this.fromSky = fromSky; this.t = rand(0, 6);
    this.life = fromSky ? 14 : 10;
    this.collected = false; this.dead = false;
    this.sx = 0; this.sy = 0; this.ct = 0;
  }
  update(dt) {
    this.t += dt;
    if (this.collected) {
      this.ct += dt;
      const k = clamp(this.ct / 0.45, 0, 1), e = 1 - (1 - k) * (1 - k);
      this.x = this.sx + (46 - this.sx) * e;
      this.y = this.sy + (62 - this.sy) * e;
      if (k >= 1) {
        game.sun += 25;
        // 태양 광폭 충전: 수집 12회 = 1충전, 최대 1개 저장 (완충 중 수집은 낭비) — 2.3
        if (!game.burstReady) {
          game.burst++;
          if (game.burst >= 12) { game.burst = 0; game.burstReady = true; }
        }
        this.dead = true;
      }
      return;
    }
    if (this.fromSky && this.y < this.targetY) this.y += 42 * dt;
    this.life -= dt;
    if (this.life <= 0) this.dead = true;
  }
}

/* ---------------- 스폰 / 진행 ---------------- */
function spawnZombie(type) {
  const row = (Math.random() * GRID.rows) | 0;
  game.zombies.push(new Zombie(type, row, 0));
}
function spawnSun(x, y, fromSky, targetY) {
  game.suns.push(new Sun(x, y, fromSky, targetY));
}
function killZombie(z) {
  if (z.dead) return;
  z.dead = true; z.eating = false;
  puff(z.x, z.y - 30, 10, ["#a8c08a", "#66788a", "#dcedc8"], 130, 0.7);
}
function loseGame() {
  if (game.state !== "playing") return;
  game.state = "lost"; SFX.lose();
}
function winGame() {
  if (game.state !== "playing") return;
  game.state = "won"; SFX.win();
}
function startGame() {
  game = newGame();
  for (const t of PTYPES) game.cd[t] = 0;
  for (let r = 0; r < GRID.rows; r++) game.mowers.push({ row: r, x: 42, active: false, used: false, wheel: 0 });
  game.state = "playing";
  banner("식물을 심으세요! 태양을 클릭해 모으세요 ☀", "#fff59d", 22, 3, 165);
}

/* ---------------- 클러치 스킬: 태양 광폭 (2.3) ---------------- */
function fireBurst() {
  if (game.state !== "playing") return;  // 일시정지/메뉴에서는 발동 불가
  if (!game.burstReady) { SFX.nope(); toast("아직 충전되지 않았어요!"); return; }
  game.burstReady = false; game.burst = 0;
  // 효과 1: 전 슈터 즉시 3연발 (더블 완두는 6발) — 각각 x 오프셋 -18/0/+18
  for (const p of game.plants) {
    if (p.type !== "peashooter" && p.type !== "snowpea" && p.type !== "repeater") continue;
    const frozen = p.type === "snowpea";
    for (const off of [-18, 0, 18]) {
      game.peas.push(new Pea(p.cx + 24 + off, p.cy - 12, p.row, frozen));
      if (p.type === "repeater") game.peas.push(new Pea(p.cx + 6 + off, p.cy - 12, p.row, frozen));
    }
  }
  // 효과 2: 전 좀비 80 고정 피해 + flashT (투척체의 화병은 대상 아님 — 좀비만)
  for (const z of game.zombies) {
    if (z.dead) continue;
    z.hp -= 80; z.flashT = 0.3;
    if (z.hp <= 0) killZombie(z);
  }
  // 효과 3: 연출 — 골드 배너 + 화면 흔들림 + 좌우 플래시
  banner("⚡ 태양 광폭!", "#ffd23e", 40, 1.6, 290);
  shake = 8; burstFlash = 0.3;
  SFX.burst(); playSfx("powerup");
}

/* ---------------- 업데이트 ---------------- */
function update(dt) {
  game.time += dt;
  for (const t of PTYPES) if (game.cd[t] > 0) game.cd[t] = Math.max(0, game.cd[t] - dt);

  // 자연 태양
  game.sunTimer -= dt;
  if (game.sunTimer <= 0) {
    game.sunTimer = rand(7, 10);
    spawnSun(rand(GRID.x + 40, GRID.x + GRID.cols * GRID.cw - 40), 0, true, rand(GRID.y + 60, GRID.y + GRID.rows * GRID.ch - 40));
  }

  // 웨이브 진행
  while (game.waveIdx < WAVES.length && game.time >= WAVES[game.waveIdx].t) {
    const w = WAVES[game.waveIdx]; game.waveIdx++;
    w.z.forEach((type, i) => game.pending.push({ at: game.time + i * 0.9 + rand(0, 1.3), type }));
    if (w.final) banner("🚩 최종 웨이브! 🚩", "#ff5252", 44, 3, 290);
    else if (game.waveIdx > 1) banner(`웨이브 ${game.waveIdx}`, "#ffffff", 30, 1.6, 270);
    SFX.wave();
  }
  // 최종 웨이브 15초 전 사전 경고 (정확히 1회) — 2.1B
  if (!game.finalWarned && game.time >= FINAL_T - 15) {
    game.finalWarned = true;
    banner("🚩 대량 좀비 다가온다! 방어 준비", "#ff5252", 30, 2.5, 290);
    SFX.warn(); playSfx("warn", { volume: 0.4 });
  }
  for (const p of game.pending) {
    if (game.time >= p.at) { spawnZombie(p.type); p.done = true; }
  }
  game.pending = game.pending.filter(p => !p.done);

  for (const p of game.plants) p.update(dt);
  for (const z of game.zombies) z.update(dt);
  for (const pea of game.peas) pea.update(dt);
  for (const s of game.suns) s.update(dt);

  // 잔디깎이
  for (const m of game.mowers) {
    if (!m.active) continue;
    m.x += 285 * dt; m.wheel += dt * 22;
    if (Math.random() < 0.5) puff(m.x - 10, GRID.y + m.row * GRID.ch + GRID.ch - 12, 1, ["#9ccc65", "#c0ca33"], 90, 0.4);
    for (const z of game.zombies) {
      if (!z.dead && z.row === m.row && z.delayT <= 0 && Math.abs(z.x - m.x) < 36) {
        z.hp = 0; killZombie(z);
      }
    }
    if (m.x > W + 60) m.active = false;
  }

  game.plants = game.plants.filter(p => !p.dead);
  game.zombies = game.zombies.filter(z => !z.dead || z.deathT > 0);
  game.peas = game.peas.filter(p => !p.dead);
  game.suns = game.suns.filter(s => !s.dead);

  // 승리 체크
  if (game.waveIdx >= WAVES.length && game.pending.length === 0 && game.zombies.every(z => z.dead)) {
    if (game.zombies.length === 0) winGame();
  }
}
function updateFX(dt) {
  shake = Math.max(0, shake - dt * 26);
  burstFlash = Math.max(0, burstFlash - dt);  // 태양 광폭 플래시 잔여시간 (2.3)
  for (const p of game.particles) {
    p.t += dt;
    if (p.type === "dot") {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += (p.g || 0) * dt;
    }
  }
  game.particles = game.particles.filter(p => p.t < p.dur);
  for (const s of game.scorches) s.t += dt;
  game.scorches = game.scorches.filter(s => s.t < s.dur);
}

/* ---------------- 그리기: 식물 ---------------- */
function drawLeaf(x, y, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "#3e8e2f";
  ctx.beginPath(); ctx.ellipse(7, 0, 9, 4, 0, 0, 7); ctx.fill();
  ctx.restore();
}
function drawStem() {
  ctx.strokeStyle = "#3e8e2f"; ctx.lineWidth = 5; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, 30); ctx.quadraticCurveTo(2, 16, 0, 2); ctx.stroke();
  drawLeaf(-6, 20, -0.5); drawLeaf(6, 24, Math.PI + 0.5);
}
function drawShooterHead(colHead, colDark, colMouth, recoil, repeater, icy, anim) {
  ctx.save();
  ctx.translate(-recoil * 5, 0);
  if (repeater) {
    ctx.fillStyle = colDark;
    ctx.beginPath(); ctx.roundRect(-24, -14, 16, 11, 5); ctx.fill();
    circle(-26, -8.5, 4.5, colMouth);
  }
  circle(0, -8, 15, colHead, colDark, 2.5);
  ctx.fillStyle = colDark;
  ctx.beginPath(); ctx.roundRect(6, -15, 22, 13, 6); ctx.fill();
  circle(28, -8.5, 5.5, colMouth);
  circle(-3, -14, 4, "#ffffff");
  circle(-4.5, -14, 2, "#222");
  if (repeater) { drawLeaf(-4, -24, -1.8); }
  if (icy) { ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText("❄", 12, -22); }
  ctx.restore();
}
function drawPlant(p, x, y, scale) {
  ctx.save();
  ctx.translate(x, y + 12);
  if (scale) ctx.scale(scale, scale);
  const bob = Math.sin(p.anim * 2.5) * 2;
  const hurt = p.flashT > 0 ? Math.sin(p.flashT * 40) * 2 : 0;
  ctx.translate(hurt, 0);
  const spr = SPRITES["plant-" + p.type];
  if (spr && spr.complete && spr.naturalWidth > 0) {
    const s = p.type === "cherry" ? 1 + clamp(p.t / 1.1, 0, 1) * 0.45 : 1;
    ctx.drawImage(spr, -32 * s, -32 * s + bob * 0.6, 64 * s, 64 * s);
    ctx.restore();
    return;
  }
  switch (p.type) {
    case "sunflower": {
      drawStem();
      ctx.save(); ctx.translate(0, -8 + bob * 0.6);
      ctx.fillStyle = "#ffd23e";
      for (let i = 0; i < 12; i++) {
        ctx.save(); ctx.rotate(i * Math.PI / 6 + Math.sin(p.anim) * 0.06);
        ctx.beginPath(); ctx.ellipse(0, -16, 6, 11, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      circle(0, 0, 11.5, "#8a5a2b", "#6d441c", 2);
      circle(0, 0, 8, "#a06a33");
      circle(-3.5, -2.5, 1.8, "#3a2410"); circle(3.5, -2.5, 1.8, "#3a2410");
      ctx.strokeStyle = "#3a2410"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(0, 2, 4, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.restore();
      break;
    }
    case "peashooter": case "snowpea": case "repeater": {
      drawStem();
      const snow = p.type === "snowpea";
      const head = snow ? "#63c6e8" : "#4faf3a";
      const dark = snow ? "#3da3c8" : "#37902a";
      const mouth = snow ? "#155a70" : "#1c4a12";
      ctx.save(); ctx.translate(0, bob * 0.6);
      drawShooterHead(head, dark, mouth, p.recoil || 0, p.type === "repeater", snow, p.anim);
      ctx.restore();
      break;
    }
    case "wallnut": {
      const ratio = p.hp / p.maxhp;
      ctx.save(); ctx.translate(0, bob * 0.3);
      ctx.beginPath(); ctx.ellipse(0, -2, 24, 30, 0, 0, 7);
      ctx.fillStyle = "#c98f3f"; ctx.fill();
      ctx.strokeStyle = "#8a5f24"; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(-7, 6, 10, 16, 0.3, 0, 7);
      ctx.fillStyle = "rgba(255,235,180,0.25)"; ctx.fill();
      // 얼굴
      const squint = ratio < 0.33;
      circle(-8, -10, 5, "#fff"); circle(8, -10, 5, "#fff");
      circle(-8, -10, squint ? 1.2 : 2.4, "#3a2a10"); circle(8, -10, squint ? 1.2 : 2.4, "#3a2a10");
      ctx.strokeStyle = "#5d4022"; ctx.lineWidth = 2.5;
      ctx.beginPath();
      if (ratio < 0.66) { ctx.arc(0, 4, 6, Math.PI + 0.4, -0.4); }  // 걱정하는 입
      else { ctx.arc(0, 0, 6, 0.3, Math.PI - 0.3); }                 // 평소 미소
      ctx.stroke();
      // 금
      ctx.strokeStyle = "#6d4a1a"; ctx.lineWidth = 2;
      if (ratio < 0.66) {
        ctx.beginPath(); ctx.moveTo(12, -26); ctx.lineTo(7, -16); ctx.lineTo(13, -8); ctx.stroke();
      }
      if (ratio < 0.33) {
        ctx.beginPath(); ctx.moveTo(-14, -20); ctx.lineTo(-8, -10); ctx.lineTo(-15, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, 26); ctx.lineTo(4, 16); ctx.stroke();
      }
      ctx.restore();
      break;
    }
    case "cherry": {
      const k = clamp(p.t / 1.1, 0, 1);
      const s = 1 + k * 0.45 + Math.sin(p.anim * 18) * 0.04 * (0.3 + k);
      ctx.save(); ctx.scale(s, s);
      if (k > 0.25) {
        const g = ctx.createRadialGradient(0, 0, 4, 0, 0, 40);
        g.addColorStop(0, `rgba(255,120,40,${0.5 * k})`); g.addColorStop(1, "rgba(255,120,40,0)");
        circle(0, 0, 40, g);
      }
      ctx.strokeStyle = "#3e8e2f"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(-9, -8); ctx.quadraticCurveTo(-3, -22, 2, -24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(9, -10); ctx.quadraticCurveTo(6, -22, 2, -24); ctx.stroke();
      drawLeaf(3, -25, -0.9);
      circle(-10, 4, 13, "#e53935", "#a02724", 2.5);
      circle(10, 6, 13, "#c62828", "#8e1f1c", 2.5);
      circle(-14, 0, 2.2, "#fff"); circle(-6, -1, 2.2, "#fff");
      circle(6, 2, 2.2, "#fff"); circle(14, 1, 2.2, "#fff");
      circle(-14, 0, 1.1, "#222"); circle(-6, -1, 1.1, "#222");
      circle(6, 2, 1.1, "#222"); circle(14, 1, 1.1, "#222");
      ctx.strokeStyle = "#7f1d1b"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-15, -6); ctx.lineTo(-10, -4.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5, -4); ctx.lineTo(10, -2.5); ctx.stroke();
      ctx.restore();
      break;
    }
  }
  ctx.restore();
}

/* ---------------- 그리기: 좀비 ---------------- */
// 장비 파손 단계 (2.1C): armorRatio = (hp - 190) / (장비 좀비 최대 hp - 190) 기반 3단계
function armorStage(z) {
  const base = ZTYPES.normal.hp;
  const ratio = (z.hp - base) / (ZTYPES[z.type].hp - base);
  if (ratio > 0.6) return 1;
  if (ratio >= 0.25) return 2;
  return 3;
}
// 장비 파손 오버레이 (2.1C): 머리 중심 좌표계 — 폴백/PNG 스프라이트 위 공통 스트로크
function drawArmorDamage(z, stage) {
  if (z.type === "cone") {
    ctx.strokeStyle = "rgba(74,42,10,0.9)"; ctx.lineWidth = 1.6;
    if (stage === 2) {          // 금 1줄
      ctx.beginPath(); ctx.moveTo(-3, -33); ctx.lineTo(0, -26); ctx.lineTo(-4, -19); ctx.stroke();
    } else if (stage === 3) {   // 금 2줄
      ctx.beginPath(); ctx.moveTo(-3, -27); ctx.lineTo(1, -21); ctx.lineTo(-3, -15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(5, -27); ctx.lineTo(3, -20); ctx.lineTo(6, -14); ctx.stroke();
    }
  } else if (z.type === "bucket") {
    if (stage === 2) {          // 측면 찌그러짐 곡선 1줄
      ctx.strokeStyle = "rgba(40,48,54,0.9)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-15, -35); ctx.quadraticCurveTo(-9, -29, -15, -23); ctx.stroke();
    } else if (stage === 3) {   // 구멍 1개
      circle(5, -33, 3, "#33383c", "#5c6b73", 1.5);
    }
  }
}
// 다음 웨이브 미리보기 아이콘 (2.1A): drawZombie 폴백 머리(피부 원 14px + 장비 형태) 축소 재사용 — PNG 유무와 무관하게 동일 렌더
function drawZombieHeadIcon(x, y, type, r) {
  r = r || 7;
  ctx.save(); ctx.translate(x, y); ctx.scale(r / 7, r / 7);
  if (type === "flag") {  // 깃대 + 깃발
    ctx.strokeStyle = "#7a5230"; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(-4, 6); ctx.lineTo(-14, -16); ctx.stroke();
    ctx.fillStyle = "#d8443c";
    ctx.beginPath(); ctx.moveTo(-14, -16); ctx.lineTo(-26, -12); ctx.lineTo(-14, -8); ctx.closePath(); ctx.fill();
  }
  if (type === "thrower") {  // 목에 붉은 스카프
    ctx.fillStyle = "#d8443c";
    ctx.beginPath(); ctx.roundRect(-6, 5, 12, 5, 2); ctx.fill();
  }
  circle(0, 0, 7, "#a8c08a", "#7d9668", 1.5);  // 피부 원
  circle(-2.6, -1.6, 1.1, "#fff"); circle(0.4, -1.9, 1.3, "#fff");
  circle(-3.1, -1.6, 0.55, "#222"); circle(-0.1, -1.9, 0.6, "#222");
  if (type === "cone") {  // 콘
    ctx.fillStyle = "#e8862a"; ctx.strokeStyle = "#b05f14"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(-6, -4); ctx.lineTo(6, -4); ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else if (type === "bucket") {  // 버킷
    ctx.fillStyle = "#90a4ae"; ctx.strokeStyle = "#5c6b73"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(-7, -17, 14, 11, 2); ctx.fill(); ctx.stroke();
  } else if (type === "runner") {  // 머리 띠 1줄
    ctx.strokeStyle = "#d8443c"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6.5, -3); ctx.lineTo(6.5, -3); ctx.stroke();
  }
  ctx.restore();
}
function drawZombie(z) {
  ctx.save();
  ctx.translate(z.x, z.y);
  if (z.dead) {
    const k = 1 - clamp(z.deathT / 0.9, 0, 1);
    ctx.globalAlpha = 1 - k;
    ctx.rotate(k * 1.5);
    ctx.translate(k * 8, 0);
  } else {
    ctx.rotate(Math.sin(z.wob * 4) * 0.05);
    ctx.translate(0, -Math.abs(Math.sin(z.wob * 4)) * 2.5);
  }
  const frozen = z.slowT > 0 && !z.dead;
  const flash = z.flashT > 0;
  const skin = flash ? "#e2836f" : frozen ? "#9cc7de" : "#a8c08a";
  const shirt = frozen ? "#5f7f9e" : "#66788a";
  const dark = "#3c4653";
  const legSw = z.dead ? 0 : Math.sin(z.wob * 6) * 0.45 * (z.type === "runner" ? 1.6 : 1);  // 러너는 다리 스윙 진폭 ×1.6 (2.2)
  const zspr = SPRITES[ZSPRITE[z.type]];
  if (zspr && zspr.complete && zspr.naturalWidth > 0) {
    // 3단계 파손 버킷: 스프라이트도 8° 기울여 표현 (오버레이 방식 — 2.1C)
    if (z.type === "bucket" && z.hp > ZTYPES.normal.hp && armorStage(z) === 3) ctx.rotate(0.14);
    ctx.drawImage(zspr, -42, -42, 84, 84);
    // 장비 파손 오버레이: 금/구멍을 폴백과 동일 좌표에 스트로크 (PNG 위에도 적용 — 2.1C)
    if ((z.type === "cone" || z.type === "bucket") && z.hp > ZTYPES.normal.hp) {
      const stage = armorStage(z);
      if (stage > 1) { ctx.save(); ctx.translate(0, -30); drawArmorDamage(z, stage); ctx.restore(); }
    }
    if (frozen) { ctx.font = "12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("❄", 0, -78); }
    ctx.restore();
    return;
  }
  if (z.type === "runner") ctx.rotate(-0.17);  // 질주형: 앞(왼쪽)으로 10° 기울임 (2.2 폴백)
  // 다리
  ctx.strokeStyle = dark; ctx.lineWidth = 7; ctx.lineCap = "round";
  for (const side of [-1, 1]) {
    ctx.save(); ctx.translate(side * 5, 18); ctx.rotate(legSw * side);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 20); ctx.stroke();
    ctx.fillStyle = "#2b2b2b"; ctx.beginPath(); ctx.ellipse(-3, 22, 6, 3.5, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // 팔 (앞으로 뻗음, 체력 낮으면 한 팔 탈락)
  ctx.strokeStyle = skin; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(-8, -6); ctx.lineTo(-32, -9); ctx.stroke();
  circle(-35, -9, 5, skin);
  if (z.hp > z.maxhp * 0.5) {
    ctx.beginPath(); ctx.moveTo(-6, 2); ctx.lineTo(-26, 6); ctx.stroke();
    circle(-29, 6, 5, skin);
  } else {
    ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(-14, 4); ctx.stroke();
  }
  if (z.type === "thrower") {  // 왼손에 갈색 화병 (원 + 입구 타원) (2.2)
    circle(-38, -14, 7, "#a06a33", "#6d441c", 2);
    ctx.fillStyle = "#5d3a18";
    ctx.beginPath(); ctx.ellipse(-38, -19, 4.5, 2, 0, 0, 7); ctx.fill();
  }
  // 몸통
  ctx.fillStyle = shirt;
  ctx.beginPath(); ctx.roundRect(-14, -16, 28, 36, 6); ctx.fill();
  ctx.fillStyle = frozen ? "#8fd0e8" : "#d8443c";
  ctx.beginPath(); ctx.moveTo(-3, -14); ctx.lineTo(3, -14); ctx.lineTo(0, -2); ctx.closePath(); ctx.fill();
  if (z.type === "thrower") {  // 목에 붉은 스카프 (2.2)
    ctx.fillStyle = "#d8443c";
    ctx.beginPath(); ctx.roundRect(-9, -21, 18, 6, 3); ctx.fill();
  }
  // 머리
  const chomp = z.eating ? Math.abs(Math.sin(z.chomp * 14)) : 0;
  ctx.save();
  ctx.translate(0, -30 - chomp * 2);
  if (z.eating) ctx.rotate(Math.sin(z.chomp * 14) * 0.08);
  circle(0, 0, 15, skin, frozen ? "#5f8ba8" : "#7d9668", 2);
  // 눈
  circle(-10, -4, 4.2, "#fff"); circle(1, -5, 5, "#fff");
  circle(-12, -4, 1.8, "#222"); circle(-1, -5, 2, "#222");
  ctx.strokeStyle = "#4c5b3e"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-14, -9); ctx.lineTo(-7, -7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, -10); ctx.lineTo(-2, -8.5); ctx.stroke();
  // 입
  ctx.fillStyle = "#3a2a28";
  ctx.beginPath(); ctx.ellipse(-9, 6, 5, 2.5 + chomp * 3, 0, 0, 7); ctx.fill();
  // 머리카락
  ctx.strokeStyle = "#4c5b3e"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-6, -14); ctx.lineTo(-8, -19); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, -20); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6, -14); ctx.lineTo(8, -18); ctx.stroke();
  if (z.type === "runner") {  // 머리에 띠 1줄 + 머리 옆 땀 방울 2개 (2.2)
    ctx.strokeStyle = "#d8443c"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-14, -5); ctx.lineTo(14, -5); ctx.stroke();
    circle(16, -12, 2.2, "#9fd6ef");
    circle(19, -5, 1.7, "#9fd6ef");
  }
  // 장비 (2.1C: armorRatio 기반 3단계 파손 — hp 190 이하 소실은 기존 동작 유지)
  if (z.type === "cone" && z.hp > ZTYPES.normal.hp) {
    const stage = armorStage(z);
    ctx.fillStyle = flash ? "#f4a261" : "#e8862a";
    ctx.strokeStyle = "#b05f14"; ctx.lineWidth = 2;
    ctx.beginPath();
    if (stage === 1) {          // 1단계: 정상 (현행)
      ctx.moveTo(0, -40);
    } else if (stage === 2) {   // 2단계: 상단 꺾임
      ctx.moveTo(2, -40); ctx.lineTo(9, -33);
    } else {                    // 3단계: 뾰족 절단
      ctx.moveTo(-6, -30); ctx.lineTo(6, -30);
    }
    ctx.lineTo(13, -12); ctx.lineTo(-13, -12); ctx.closePath();
    ctx.fill(); ctx.stroke();
    if (stage === 1) {          // 반사 띠 (파손 단계에서는 소실)
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-7, -22); ctx.lineTo(7, -22); ctx.stroke();
    }
    drawArmorDamage(z, stage);  // 금 오버레이
  }
  if (z.type === "bucket" && z.hp > ZTYPES.normal.hp) {
    const stage = armorStage(z);
    ctx.save();
    ctx.translate(0, -29);              // 버킷 중심 기준
    if (stage === 3) ctx.rotate(0.14);  // 3단계: 8° 기울임
    ctx.fillStyle = flash ? "#cfd8dc" : "#90a4ae";
    ctx.strokeStyle = "#5c6b73"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-15, -13, 30, 26, 4); ctx.fill(); ctx.stroke();
    if (stage === 1) {                  // 광택선 (2단계부터 제거)
      ctx.strokeStyle = "rgba(255,255,255,0.5)"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(-9, -9); ctx.lineTo(-9, 9); ctx.stroke();
    }
    ctx.save(); ctx.translate(0, 29);   // 오버레이는 머리 기준 좌표 (PNG 경로와 동일 함수)
    drawArmorDamage(z, stage);
    ctx.restore();
    ctx.restore();
  }
  if (z.type === "flag") {
    ctx.strokeStyle = "#7a5230"; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.moveTo(-30, -6); ctx.lineTo(-34, -62); ctx.stroke();
    const waveF = Math.sin(z.wob * 7) * 3;
    ctx.fillStyle = "#d8443c";
    ctx.beginPath();
    ctx.moveTo(-34, -62); ctx.lineTo(-62 + waveF, -54); ctx.lineTo(-34, -46);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore(); // 머리
  // 얼림 표시
  if (frozen) { ctx.font = "12px sans-serif"; ctx.textAlign = "center"; ctx.fillText("❄", 0, -78); }
  ctx.restore();
}

/* ---------------- 그리기: 기타 ---------------- */
function drawSunIcon(x, y, r, t) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(t * 0.7);
  const pulse = 1 + Math.sin(t * 3) * 0.06;
  ctx.scale(pulse, pulse);
  const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
  g.addColorStop(0, "#fff7c0"); g.addColorStop(0.55, "#ffd94d"); g.addColorStop(1, "rgba(255,200,40,0)");
  circle(0, 0, r, g);
  ctx.fillStyle = "#ffce33";
  for (let i = 0; i < 8; i++) {
    ctx.save(); ctx.rotate(i * Math.PI / 4);
    ctx.beginPath(); ctx.moveTo(r * 0.55, -3.5); ctx.lineTo(r * 0.95, 0); ctx.lineTo(r * 0.55, 3.5);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  circle(0, 0, r * 0.52, "#fff2a8");
  ctx.restore();
}
function drawMower(m) {
  if (m.used && !m.active) return;
  const y = GRID.y + m.row * GRID.ch + GRID.ch - 14;
  ctx.save(); ctx.translate(m.x, y);
  if (m.active) ctx.translate(rand(-1, 1), rand(-1, 1));
  ctx.strokeStyle = "#455a64"; ctx.lineWidth = 4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(-12, -12); ctx.lineTo(-26, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-26, -30); ctx.lineTo(-20, -33); ctx.stroke();
  rrect(-17, -17, 34, 15, 4, m.active ? "#e53935" : "#c62828", "#8e1f1c", 2);
  rrect(-6, -23, 14, 8, 2, "#b0bec5", "#78909c", 1.5);
  for (const wx of [-9, 9]) {
    circle(wx, 1, 5.5, "#37474f", "#263238", 1.5);
    ctx.strokeStyle = "#90a4ae"; ctx.lineWidth = 1.5;
    ctx.save(); ctx.translate(wx, 1); ctx.rotate(m.wheel);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
}
function drawLawn() {
  // 하늘/배경
  ctx.fillStyle = "#24401c"; ctx.fillRect(0, 0, W, H);
  // 잔디
  for (let r = 0; r < GRID.rows; r++) {
    for (let c = 0; c < GRID.cols; c++) {
      ctx.fillStyle = (r + c) % 2 === 0 ? "#7ec850" : "#6db544";
      ctx.fillRect(GRID.x + c * GRID.cw, GRID.y + r * GRID.ch, GRID.cw, GRID.ch);
    }
  }
  // 마을(왼쪽)
  ctx.fillStyle = "#8a5a2b"; ctx.fillRect(0, GRID.y, GRID.x, GRID.rows * GRID.ch);
  ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2;
  for (let y = GRID.y; y <= GRID.y + GRID.rows * GRID.ch; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(GRID.x, y); ctx.stroke();
  }
  ctx.fillStyle = "#5d3a18"; ctx.fillRect(GRID.x - 6, GRID.y, 6, GRID.rows * GRID.ch);
  // 길(오른쪽)
  ctx.fillStyle = "#3b3b2a"; ctx.fillRect(GRID.x + GRID.cols * GRID.cw, GRID.y, W, GRID.rows * GRID.ch);
  ctx.fillStyle = "#2e2e20";
  for (let y = GRID.y + 10; y < GRID.y + GRID.rows * GRID.ch; y += 60) {
    ctx.fillRect(GRID.x + GRID.cols * GRID.cw + 12, y, 16, 30);
  }
  // 흙길(위/아래)
  ctx.fillStyle = "#5d4022";
  ctx.fillRect(GRID.x, GRID.y - 26, GRID.cols * GRID.cw, 26);
  ctx.fillRect(GRID.x, GRID.y + GRID.rows * GRID.ch, GRID.cols * GRID.cw, H - (GRID.y + GRID.rows * GRID.ch));
  // 그리드 선
  ctx.strokeStyle = "rgba(0,0,0,0.06)"; ctx.lineWidth = 1;
  for (let c = 0; c <= GRID.cols; c++) {
    ctx.beginPath(); ctx.moveTo(GRID.x + c * GRID.cw, GRID.y); ctx.lineTo(GRID.x + c * GRID.cw, GRID.y + GRID.rows * GRID.ch); ctx.stroke();
  }
  for (let r = 0; r <= GRID.rows; r++) {
    ctx.beginPath(); ctx.moveTo(GRID.x, GRID.y + r * GRID.ch); ctx.lineTo(GRID.x + GRID.cols * GRID.cw, GRID.y + r * GRID.ch); ctx.stroke();
  }
  // 그을음
  for (const s of game.scorches) {
    const a = clamp(1 - s.t / s.dur, 0, 1) * 0.55;
    const g = ctx.createRadialGradient(s.x, s.y, 5, s.x, s.y, 90);
    g.addColorStop(0, `rgba(30,20,10,${a})`); g.addColorStop(1, "rgba(30,20,10,0)");
    circle(s.x, s.y, 90, g);
  }
}

/* ---------------- 그리기: HUD ---------------- */
function drawHUD() {
  // 목재 바
  const g = ctx.createLinearGradient(0, 0, 0, 130);
  g.addColorStop(0, "#6b4423"); g.addColorStop(1, "#4a2d12");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 130);
  ctx.fillStyle = "rgba(0,0,0,0.25)"; ctx.fillRect(0, 126, W, 4);
  ctx.strokeStyle = "rgba(255,220,150,0.25)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 127.5); ctx.lineTo(W, 127.5); ctx.stroke();

  // 태양 카운터
  rrect(12, 15, 84, 100, 10, "#f7ecc5", "#8a5a2b", 3);
  drawSunIcon(54, 50, 21, game.time);
  text(String(game.sun), 54, 94, 24, "#5b3a1e", true);

  // 씨앗 패킷
  for (let i = 0; i < PTYPES.length; i++) {
    const t = PTYPES[i], px = 108 + i * 80, d = PLANTS[t];
    const ready = game.cd[t] <= 0, afford = game.sun >= d.cost;
    const sel = game.selected === t;
    rrect(px, 15, 74, 100, 8, ready && afford ? "#e8d9a8" : "#b3a586",
      sel ? "#ffd23e" : "#7a5a2f", sel ? 4 : 2);
    const fake = { type: t, anim: game.time, hp: 1, maxhp: 1, flashT: 0, recoil: 0, t: 0 };
    drawPlant(fake, px + 37, 46, 0.62);
    text(String(d.cost), px + 37, 106, 15, afford ? "#3a2a10" : "#c62828", true);
    if (!ready) {
      const frac = clamp(game.cd[t] / d.cd, 0, 1);
      ctx.fillStyle = "rgba(20,20,20,0.55)";
      ctx.beginPath(); ctx.roundRect(px + 2, 15 + 100 - 98 * frac, 70, 98 * frac, 6); ctx.fill();
      text(Math.ceil(game.cd[t]) + "s", px + 37, 66, 18, "#fff", true);
    }
    // 호버 툴팁
    if (game.mx >= px && game.mx <= px + 74 && game.my >= 15 && game.my <= 115 && game.state === "playing") {
      const tipW = 168, tipX = clamp(px + 37 - tipW / 2, 4, W - tipW - 4);
      rrect(tipX, 136, tipW, 46, 8, "rgba(30,22,10,0.92)", "#c9a86a", 2);
      text(d.name, tipX + tipW / 2, 152, 16, "#ffd23e", true);
      text(d.desc + " · 태양 " + d.cost, tipX + tipW / 2, 170, 12, "#e8dfc8", false);
    }
  }

  // 삽
  const sh = BTN.shovel;
  rrect(sh.x, sh.y, sh.w, sh.h, 8, "#c9b487", game.shovel ? "#ffd23e" : "#7a5a2f", game.shovel ? 4 : 2);
  ctx.save(); ctx.translate(sh.x + 35, sh.y + 40); ctx.rotate(0.7);
  ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(0, 6); ctx.stroke();
  ctx.strokeStyle = "#6d441c"; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.arc(0, -24, 6, Math.PI, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = "#aeb8bd"; ctx.strokeStyle = "#78868c"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-9, 6); ctx.lineTo(9, 6); ctx.lineTo(6, 24); ctx.quadraticCurveTo(0, 30, -6, 24); ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.restore();
  text("삽", sh.x + 35, sh.y + 86, 14, "#5b3a1e", true);

  // 일시정지 / 소리
  rrect(BTN.pause.x, BTN.pause.y, BTN.pause.w, BTN.pause.h, 8, "#8a5a2b", "#5b3a1e", 2);
  if (game.state === "paused") {
    ctx.fillStyle = "#f7ecc5";
    ctx.beginPath(); ctx.moveTo(BTN.pause.x + 16, BTN.pause.y + 12); ctx.lineTo(BTN.pause.x + 34, BTN.pause.y + 23); ctx.lineTo(BTN.pause.x + 16, BTN.pause.y + 34); ctx.closePath(); ctx.fill();
  } else {
    ctx.fillStyle = "#f7ecc5";
    ctx.fillRect(BTN.pause.x + 14, BTN.pause.y + 12, 6, 22);
    ctx.fillRect(BTN.pause.x + 26, BTN.pause.y + 12, 6, 22);
  }
  rrect(BTN.mute.x, BTN.mute.y, BTN.mute.w, BTN.mute.h, 8, "#8a5a2b", "#5b3a1e", 2);
  text(muted ? "🔇" : "🔊", BTN.mute.x + 23, BTN.mute.y + 24, 20, "#fff");

  // 웨이브 진행 바
  const prog = clamp(game.time / FINAL_T, 0, 1);
  const bx = 690, by = 25, bw = 236, bh = 16;
  rrect(bx, by, bw, bh, 8, "rgba(0,0,0,0.45)", "#c9a86a", 2);
  const pg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  pg.addColorStop(0, "#7ec850"); pg.addColorStop(1, prog > 0.85 ? "#ff5252" : "#4caf3a");
  if (prog > 0.02) rrect(bx + 2, by + 2, (bw - 4) * prog, bh - 4, 6, pg);
  // 🚩 아이콘 — 최종 웨이브 경고 후 sin 알파 깜빡임 (2.1B)
  ctx.globalAlpha = game.finalWarned ? 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(game.time * 5)) : 1;
  text("🚩", bx + bw + 12, by + 8, 15, "#fff");
  ctx.globalAlpha = 1;

  // 다음 웨이브 미리보기 행 (진행바 아래 y 48~66, 마지막 웨이브 이후 비표시) — 2.1A
  const isBig = game.waveIdx < WAVES.length && WAVES[game.waveIdx].z.length >= 6;
  const counterStr = isBig
    ? `${Math.min(game.waveIdx, WAVES.length)} / ${WAVES.length}`   // 대량 웨이브: "대규모!" 라벨과 공존 위해 축약
    : `웨이브 ${Math.min(game.waveIdx, WAVES.length)} / ${WAVES.length}`;
  ctx.font = font(isBig ? 11 : 12, true);
  const counterW = ctx.measureText(counterStr).width;
  if (game.waveIdx < WAVES.length) {
    const w = WAVES[game.waveIdx];
    const py = 48, ph = 18;
    const big = w.z.length >= 6;
    if (big) rrect(bx, py, bw, ph, 6, "rgba(255,82,82,0.18)");  // 대량 웨이브 붉은 반투명 띠
    // 타입별 집계 (표시 순서: flag → bucket → thrower → cone → runner → normal)
    const types = ["flag", "bucket", "thrower", "cone", "runner", "normal"].filter(t => w.z.includes(t));
    ctx.font = font(11, true);
    const labelW = big ? ctx.measureText("대규모!").width : 0;
    // 카운터(+대규모! 라벨) 영역을 피한 남은 폭에 맞춰 아이콘 간격 자동 조절
    const rightLimit = bx + bw - counterW - 8 - (big ? labelW + 8 : 0);
    const pitch = types.length ? clamp((rightLimit - bx - 12) / types.length, 18, 40) : 40;
    const headR = pitch >= 26 ? 7 : 5.5;
    let ix = bx + 12 + headR;
    for (const t of types) {
      const n = w.z.filter(v => v === t).length;
      drawZombieHeadIcon(ix, py + ph / 2, t, headR);
      text("×" + n, ix + headR + 2, py + ph / 2 + 1, pitch >= 26 ? 11 : 9, "#f0e6c8", true, "left");
      ix += pitch;
    }
    if (big) text("대규모!", bx + bw - counterW - 8 - labelW / 2, py + ph / 2, 11, "#ff8a80", true);
  }
  // "웨이브 N / M" 카운터 — 미리보기 행 우측정렬로 이동 (기존: y=63 중앙) — 2.1A
  text(counterStr, bx + bw, 57, isBig ? 11 : 12, "#f0e6c8", true, "right");

  // 태양 광폭 버튼 (2.3) — (690, 72, 236×44): 충전 중 게이지 + 태양 아이콘 + n/12, 완충 시 골드 펄스
  const bb = BTN.burst;
  const bReady = game.burstReady;
  const pulse = 0.5 + 0.5 * Math.sin(game.time * 6);
  rrect(bb.x, bb.y, bb.w, bb.h, 8, "rgba(50,32,12,0.9)", bReady ? "#ffd23e" : "#7a5a2f", bReady ? 3 + pulse * 2 : 2);
  const gFrac = bReady ? 1 : clamp(game.burst / 12, 0, 1);
  if (gFrac > 0) rrect(bb.x + 3, bb.y + 3, (bb.w - 6) * gFrac, bb.h - 6, 6, bReady ? "rgba(255,210,62,0.32)" : "rgba(255,210,62,0.2)");
  drawSunIcon(bb.x + 26, bb.y + bb.h / 2, 13, game.time);
  if (bReady) text("⚡ 발동!", bb.x + 46 + (bb.w - 50) / 2, bb.y + bb.h / 2, 19, "#ffd23e", true);
  else text(`${game.burst} / 12`, bb.x + 46 + (bb.w - 50) / 2, bb.y + bb.h / 2 + 1, 17, "#f0e6c8", true);
}

/* ---------------- 전체 그리기 ---------------- */
function draw() {
  if (game.state === "menu") { drawMenu(); return; }
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#24401c"; ctx.fillRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake) * 0.6, rand(-shake, shake) * 0.6);

  drawLawn();
  for (const m of game.mowers) drawMower(m);

  // 식물 (행 순)
  const plants = [...game.plants].sort((a, b) => a.row - b.row || a.col - b.col);
  for (const p of plants) drawPlant(p, p.cx, p.cy);

  // 좀비 (행 순, 같은 행은 x 순)
  const zombies = [...game.zombies].sort((a, b) => a.row - b.row || a.x - b.x);
  for (const z of zombies) drawZombie(z);

  // 완두콩
  for (const pea of game.peas) {
    if (pea.evil) {  // 화병: 갈색 렌더 (2.2)
      circle(pea.x, pea.y, 8, "#a06a33", "#6d441c", 2);
      ctx.fillStyle = "#5d3a18";
      ctx.beginPath(); ctx.ellipse(pea.x - 3, pea.y - 6, 4, 2, -0.5, 0, 7); ctx.fill();
      continue;
    }
    circle(pea.x - 6, pea.y, 4, pea.frozen ? "rgba(140,215,245,0.35)" : "rgba(120,200,80,0.35)");
    circle(pea.x, pea.y, 7, pea.frozen ? "#6cd0f0" : "#59c93c", pea.frozen ? "#2f8db3" : "#3a8f22", 2);
    circle(pea.x - 2, pea.y - 2.5, 2, "rgba(255,255,255,0.6)");
  }

  // 파티클
  for (const p of game.particles) {
    const a = clamp(1 - p.t / p.dur, 0, 1);
    if (p.type === "dot") {
      ctx.globalAlpha = a;
      circle(p.x, p.y, p.r * (0.5 + a * 0.5), p.color);
      ctx.globalAlpha = 1;
    } else if (p.type === "banner") {
      const pop = p.t < 0.18 ? 0.6 + (p.t / 0.18) * 0.4 : 1;
      ctx.globalAlpha = p.t > p.dur - 0.35 ? clamp((p.dur - p.t) / 0.35, 0, 1) : 1;
      ctx.save(); ctx.translate(W / 2, p.y); ctx.scale(pop, pop);
      ctx.font = font(p.size, true); ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineWidth = 6; ctx.strokeStyle = "rgba(0,0,0,0.7)"; ctx.strokeText(p.text, 0, 0);
      ctx.fillStyle = p.color; ctx.fillText(p.text, 0, 0);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  }

  // 태양 (맨 위)
  for (const s of game.suns) {
    const blink = !s.collected && s.life < 3 ? (Math.sin(s.life * 12) > 0 ? 1 : 0.35) : 1;
    ctx.globalAlpha = blink;
    drawSunIcon(s.x, s.y, s.collected ? 20 * (1 - s.ct * 0.8) : 22, s.t);
    ctx.globalAlpha = 1;
  }

  // 배치 미리보기
  const gc = Math.floor((game.mx - GRID.x) / GRID.cw), gr = Math.floor((game.my - GRID.y) / GRID.ch);
  if (game.selected && gc >= 0 && gc < GRID.cols && gr >= 0 && gr < GRID.rows) {
    const occupied = !!plantAt(gc, gr);
    ctx.globalAlpha = 0.55;
    if (!occupied) {
      const fake = { type: game.selected, anim: game.time, hp: 1, maxhp: 1, flashT: 0, recoil: 0, t: 0 };
      drawPlant(fake, cellCX(gc), cellCY(gr));
    } else {
      ctx.strokeStyle = "#ff5252"; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.roundRect(GRID.x + gc * GRID.cw + 6, GRID.y + gr * GRID.ch + 6, GRID.cw - 12, GRID.ch - 12, 10); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(GRID.x + gc * GRID.cw + 20, GRID.y + gr * GRID.ch + 20);
      ctx.lineTo(GRID.x + (gc + 1) * GRID.cw - 20, GRID.y + (gr + 1) * GRID.ch - 20); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore(); // shake

  drawHUD();

  // 태양 광폭 화면 플래시 (알파 0.25, 0.3s) — 2.3
  if (burstFlash > 0) {
    ctx.fillStyle = `rgba(255,210,62,${(0.25 * burstFlash / 0.3).toFixed(3)})`;
    ctx.fillRect(0, 0, W, H);
  }

  // 삽 커서
  if (game.shovel) {
    ctx.save(); ctx.translate(game.mx, game.my); ctx.rotate(0.7);
    ctx.strokeStyle = "#8a5a2b"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(0, 4); ctx.stroke();
    ctx.fillStyle = "#aeb8bd";
    ctx.beginPath(); ctx.moveTo(-8, 4); ctx.lineTo(8, 4); ctx.lineTo(5, 20); ctx.quadraticCurveTo(0, 26, -5, 20); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // 배너 위 정리 문구는 particles에서 처리됨
  if (game.state === "paused") {
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.fillRect(0, 0, W, H);
    text("⏸ 일시정지", 500, 300, 40, "#ffffff", true);
    text("Space 또는 ▶ 버튼으로 계속하기", 500, 350, 18, "#e0d8c0", false);
  }
  if (game.state === "won" || game.state === "lost") drawEndOverlay(game.state === "won");
}

/* ---------------- 입력 ---------------- */
function toXY(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener("pointermove", e => {
  const p = toXY(e); game.mx = p.x; game.my = p.y;
});
canvas.addEventListener("pointerdown", e => {
  ac();
  const { x, y } = toXY(e);
  if (game.state === "menu") {
    if (inRect(x, y, BTN.start)) startGame();
    return;
  }
  if (game.state === "won" || game.state === "lost") {
    if (inRect(x, y, BTN.again)) startGame();
    return;
  }
  if (inRect(x, y, BTN.pause)) {
    game.state = game.state === "paused" ? "playing" : "paused";
    return;
  }
  if (inRect(x, y, BTN.mute)) { muted = !muted; return; }
  if (game.state !== "playing") return;

  // 태양 클릭
  for (let i = game.suns.length - 1; i >= 0; i--) {
    const s = game.suns[i];
    if (!s.collected && dist(x, y, s.x, s.y) < 34) {
      s.collected = true; s.ct = 0; s.sx = s.x; s.sy = s.y;
      puff(s.x, s.y, 5, ["#fff3ae", "#ffe66b"], 80, 0.4, 0);
      SFX.sun();
      return;
    }
  }
  // 씨앗 패킷
  for (let i = 0; i < PTYPES.length; i++) {
    const px = 108 + i * 80, t = PTYPES[i];
    if (x >= px && x <= px + 74 && y >= 15 && y <= 115) {
      if (game.selected === t) { game.selected = null; return; }
      if (game.cd[t] > 0) { toast("아직 준비 중이에요!"); SFX.nope(); return; }
      if (game.sun < PLANTS[t].cost) { toast("태양이 부족해요!"); SFX.nope(); return; }
      game.selected = t; game.shovel = false;
      return;
    }
  }
  // 삽
  if (inRect(x, y, BTN.shovel)) { game.shovel = !game.shovel; game.selected = null; return; }

  // 태양 광폭 버튼 (패킷 루프 이후 · 격자 체크 이전 — 버튼 영역은 격자와 안 겹침) — 2.3
  if (inRect(x, y, BTN.burst)) { fireBurst(); return; }

  // 격자
  const c = Math.floor((x - GRID.x) / GRID.cw), r = Math.floor((y - GRID.y) / GRID.ch);
  if (c >= 0 && c < GRID.cols && r >= 0 && r < GRID.rows) {
    if (game.shovel) {
      const p = plantAt(c, r);
      if (p) {
        p.dead = true;
        game.plants = game.plants.filter(pp => !pp.dead);
        puff(cellCX(c), cellCY(r), 10, ["#8d6e63", "#a1887f", "#6d4c41"], 130, 0.5);
        SFX.plant(); game.shovel = false;
      } else toast("여기엔 식물이 없어요");
      return;
    }
    if (game.selected) {
      if (plantAt(c, r)) { toast("여기엔 이미 식물이 있어요!"); SFX.nope(); return; }
      const d = PLANTS[game.selected];
      if (game.sun < d.cost) { toast("태양이 부족해요!"); SFX.nope(); return; }
      game.sun -= d.cost;
      game.cd[game.selected] = d.cd;
      game.plants.push(new Plant(game.selected, c, r));
      puff(cellCX(c), cellCY(r) + 20, 8, ["#8d6e63", "#5d4022", "#a1887f"], 110, 0.5);
      SFX.plant(); playSfx("select", { volume: 0.4 });
      game.selected = null;
    }
  }
});
canvas.addEventListener("contextmenu", e => {
  e.preventDefault();
  game.selected = null; game.shovel = false;
});
window.addEventListener("keydown", e => {
  if (e.code === "Space") {
    e.preventDefault();
    if (game.state === "playing") game.state = "paused";
    else if (game.state === "paused") game.state = "playing";
  }
  if (e.key === "Escape") { game.selected = null; game.shovel = false; }
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 6 && game.state === "playing") {
    const t = PTYPES[n - 1];
    if (game.cd[t] <= 0 && game.sun >= PLANTS[t].cost) { game.selected = t; game.shovel = false; }
  }
  if (e.code === "KeyQ" && game.state === "playing") fireBurst();  // 태양 광폭 단축키 (2.3)
});

/* ---------------- 루프 ---------------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (game.state === "playing") update(dt);
  updateFX(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.game = game;
window.__start = startGame;
// 테스트/디버깅 훅
window.Plant = Plant; window.Zombie = Zombie; window.Sun = Sun; window.Pea = Pea;
window.__update = update;
</script>
</body>
</html>
