<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N금융사업부 설계사 자격시험 연수원</title>
<style>
:root {
  --bg: #f4f6f8; --card: #ffffff; --line: #e2e8f0; --ink: #0f172a; --ink2: #475569;
  --ink3: #94a3b8; --accent: #0284c7; --dark: #0f172a; --ok: #059669; --bad: #e11d48;
  --chip: #f1f5f9;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', -apple-system, sans-serif;
  font-size: 14px; min-height: 100vh; display: flex; flex-direction: column;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
button:disabled { cursor: default; opacity: .45; }
header {
  background: var(--card); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 30;
}
.hwrap {
  max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 62px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .mark {
  width: 32px; height: 32px; background: var(--dark); color: #fff; border-radius: 6px;
  display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
}
.brand .t1 { font-size: 15px; font-weight: 800; }
.brand .t2 { font-size: 11px; color: var(--ink2); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  padding: 8px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--ink2);
}
nav button:hover { background: var(--chip); color: var(--ink); }
nav button.on { background: var(--dark); color: #fff; }
.huser { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--ink2); }
.huser b { color: var(--ink); font-size: 12px; }
.huser button { color: var(--ink3); font-size: 15px; padding: 4px; }
.huser button:hover { color: var(--ink); }
main { max-width: 1200px; width: 100%; margin: 0 auto; padding: 22px 20px 60px; flex: 1; }

/* 공용 */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.pill { padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.tag-lab { background: var(--chip); color: var(--ink2); }
.tag-ok { background: #ecfdf5; color: var(--ok); }
.tag-bad { background: #fff1f2; color: var(--bad); }
.muted { color: var(--ink2); font-size: 12px; }
.mini { color: var(--ink3); font-size: 11px; }
.btn {
  padding: 9px 14px; border-radius: 8px; font-size: 12px; font-weight: 800;
  background: var(--dark); color: #fff;
}
.btn:hover { background: #1e293b; }
.btn.ghost { background: var(--chip); color: var(--ink2); border: 1px solid var(--line); }
.btn.ghost:hover { background: #e8edf3; }
.btn.accent { background: var(--accent); }
.btn.accent:hover { background: #0369a1; }
.btn.danger { background: #e11d48; }
.btn.danger:hover { background: #be123c; }

/* 토스트 */
#toast {
  position: fixed; right: 20px; bottom: 22px; z-index: 60;
  background: var(--dark); color: #fff; padding: 11px 16px; border-radius: 9px;
  font-size: 12px; font-weight: 600; display: none; box-shadow: 0 8px 24px rgba(15,23,42,.25);
}

/* 로그인 */
.login {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 18px;
}
.login .box {
  width: 100%; max-width: 420px; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 34px; box-shadow: 0 10px 30px rgba(15,23,42,.06);
}
.login h1 { font-size: 20px; margin: 5px 0 6px; }
.login p { font-size: 12px; color: var(--ink2); }
.login .cap {
  font-size: 11px; font-weight: 800; color: var(--ink2); letter-spacing: .08em;
  text-transform: uppercase; padding-bottom: 18px; margin-bottom: 22px;
  border-bottom: 1px solid #f1f5f9;
}
.kakao {
  width: 100%; padding: 14px; border-radius: 10px; background: #FEE500;
  font-weight: 800; font-size: 13px; margin-top: 24px;
}
.kakao:hover { background: #f5dc00; }

/* ===== 강의실 ===== */
.studio { display: grid; grid-template-columns: 1fr; gap: 20px; }
@media (min-width: 1024px) { .studio { grid-template-columns: 3fr 9fr; } }
.curr { display: flex; flex-direction: column; overflow: hidden; }
.curr .head { padding: 15px; background: var(--chip); border-bottom: 1px solid var(--line); }
.curr .head h2 { font-size: 11.5px; font-weight: 800; color: var(--ink2); letter-spacing: .05em; margin-bottom: 10px; }
.catbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: #e2e8f0; padding: 4px; border-radius: 8px; }
.catbar button { padding: 7px 0; border-radius: 6px; font-size: 11.5px; font-weight: 800; color: var(--ink2); }
.catbar button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.curr .list { max-height: 560px; overflow-y: auto; }
.course-row {
  width: 100%; text-align: left; padding: 14px; border-bottom: 1px solid #f1f5f9;
  display: flex; justify-content: space-between; gap: 8px; align-items: flex-start;
}
.course-row:hover { background: #f8fafc; }
.course-row.on { background: var(--dark); color: #fff; }
.course-row .code { font-size: 11px; font-weight: 800; color: var(--ink3); }
.course-row.on .code { color: #38bdf8; }
.course-row .cat { font-size: 12px; font-weight: 800; margin-top: 4px; line-height: 1.4; }
.course-row .done { color: var(--ok); font-size: 15px; flex-shrink: 0; }
.course-row.on .done { color: #34d399; }

.lecture { display: flex; flex-direction: column; gap: 16px; }
.lect-top { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lect-top .sub { font-size: 12px; color: var(--ink2); margin-bottom: 4px; display: flex; gap: 8px; align-items: center; }
.lect-top h2 { font-size: 17px; }
.parts { display: flex; gap: 6px; flex-shrink: 0; }
.parts button {
  padding: 7px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 800;
  border: 1px solid var(--line); color: var(--ink2); background: #fff;
}
.parts button.on { background: var(--dark); color: #fff; border-color: var(--dark); }
.parts button:hover:not(.on) { background: #f8fafc; }

.stage { display: grid; grid-template-columns: 1fr; overflow: hidden; }
@media (min-width: 1024px) { .stage { grid-template-columns: 8fr 4fr; } }
.slide { padding: 26px 28px; display: flex; flex-direction: column; }
.slide .meta { display: flex; justify-content: space-between; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; margin-bottom: 18px; }
.slide .chap { color: #0369a1; font-weight: 800; font-size: 12px; }
.slide h3 { font-size: 21px; line-height: 1.45; margin-bottom: 8px; }
.slide .sub { color: var(--ink2); font-size: 12.5px; margin-bottom: 20px; }
.vcards { display: grid; grid-template-columns: 1fr; gap: 14px; margin: 6px 0 20px; }
@media (min-width: 640px) { .vcards { grid-template-columns: 1fr 1fr; } }
.vcard {
  border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; padding: 18px;
  display: flex; flex-direction: column; justify-content: space-between; min-height: 150px;
}
.vcard .tag { font-size: 10.5px; font-weight: 800; color: var(--ink2); text-transform: uppercase; }
.vcard .ttl { font-size: 13px; font-weight: 800; margin-top: 5px; }
.vcard .hi { font-size: 16px; font-weight: 800; color: var(--accent); margin: 8px 0; }
.vcard .pt { font-size: 11.5px; color: var(--ink2); line-height: 1.6; border-top: 1px solid #e2e8f0; padding-top: 8px; }
.formula {
  background: var(--dark); color: #fff; border-radius: 9px; padding: 12px 16px;
  font-size: 12.5px; font-weight: 700; margin-top: auto;
}

/* 강사 패널 */
.presenter {
  background: #141821; color: #fff; display: flex; flex-direction: column;
  justify-content: space-between; padding: 22px; user-select: none;
  border-top: 1px solid var(--line);
}
@media (min-width: 1024px) { .presenter { border-top: none; border-left: 1px solid var(--line); } }
.presenter .top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 14px; }
.presenter .studio-lab { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: #94a3b8; text-transform: uppercase; }
.presenter h4 { font-size: 13.5px; margin-top: 3px; }
.state-chip { padding: 4px 10px; border-radius: 6px; font-size: 10.5px; font-weight: 700; background: #1e293b; color: #94a3b8; }
.state-chip.speaking { background: rgba(16,185,129,.15); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
.avatar-wrap { display: flex; flex-direction: column; align-items: center; margin: 22px 0; }
.avatar-ring {
  position: relative; width: 140px; height: 140px; border-radius: 50%;
  background: rgba(30,41,59,.9); border: 2px solid #334155;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.avatar-ring.speaking::before {
  content: ""; position: absolute; inset: -2px; border-radius: 50%;
  border: 2px solid rgba(56,189,248,.6); animation: ping 1.2s ease-out infinite;
}
@keyframes ping { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.25); opacity: 0; } }
.avatar-ring svg { width: 112px; height: 112px; }
.eq { display: flex; gap: 4px; align-items: flex-end; height: 24px; margin-top: 18px; }
.eq span { width: 4px; border-radius: 4px; background: #334155; height: 5px; transition: height .15s; }
.eq span.hot { background: #38bdf8; }
.presenter .hint { font-size: 11px; color: #94a3b8; margin-top: 8px; text-align: center; }
.audio-box { background: #1c222e; border: 1px solid #1e293b; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.arow { display: flex; justify-content: space-between; align-items: center; }
.arow .lab { font-size: 11px; color: #cbd5e1; font-weight: 600; }
.speed-set { display: flex; gap: 4px; }
.speed-set button { padding: 5px 9px; border-radius: 6px; font-size: 10.5px; font-weight: 800; background: #1e293b; color: #94a3b8; }
.speed-set button:hover { color: #fff; }
.speed-set button.on { background: #0284c7; color: #fff; }
.mute-btn { padding: 5px 10px; border-radius: 6px; font-size: 10.5px; font-weight: 800; background: #1e293b; color: #e2e8f0; display: flex; align-items: center; gap: 5px; }
.mute-btn.muted { background: rgba(225,29,72,.2); color: #fda4af; border: 1px solid rgba(225,29,72,.3); }

/* 텔레프롬프터 */
.tele { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.tele .frame { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 15px; }
.tele .frame .head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.tele .body { font-size: 13px; line-height: 2; }
.tele .body span.s { cursor: pointer; padding: 1px 2px; border-radius: 4px; color: var(--ink2); }
.tele .body span.s:hover { color: var(--ink); }
.tele .body span.s.cur { background: #e0f2fe; color: var(--ink); font-weight: 800; }
.ctrls { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctrls .left { display: flex; gap: 8px; align-items: center; }
.ctrls .right { display: flex; gap: 8px; align-items: center; }
.play-btn { padding: 11px 20px; border-radius: 9px; font-weight: 800; font-size: 12.5px; color: #fff; display: flex; align-items: center; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line);
  color: var(--ink2); display: flex; align-items: center; justify-content: center; font-size: 15px;
}
.icon-btn:hover:not(:disabled) { background: #f8fafc; }

/* ===== 모의고사 ===== */
.exam-top { padding: 14px 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.exam-cats { display: flex; gap: 6px; flex-wrap: wrap; }
.exam-cats button { padding: 8px 14px; border-radius: 8px; font-size: 11.5px; font-weight: 800; background: var(--chip); color: var(--ink2); }
.exam-cats button.on { background: var(--dark); color: #fff; }
.q { padding: 22px; margin-top: 14px; }
.q .head { display: flex; justify-content: space-between; margin-bottom: 12px; }
.q h3 { font-size: 14.5px; margin-bottom: 16px; line-height: 1.6; }
.opt {
  width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 9px;
  padding: 13px 14px; display: flex; gap: 10px; align-items: flex-start; margin-top: 8px;
  font-size: 12.5px; color: var(--ink2); line-height: 1.6; background: #fff;
}
.opt:hover:not(:disabled) { background: #f8fafc; }
.opt .no { width: 20px; height: 20px; border-radius: 5px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex-shrink: 0; }
.opt.sel { border-color: var(--dark); background: rgba(15,23,42,.05); color: var(--ink); font-weight: 700; }
.opt.ans { border-color: var(--ok); background: #ecfdf5; color: #064e3b; font-weight: 800; }
.opt.wrong { border-color: #fb7185; background: #fff1f2; color: #881337; text-decoration: line-through; }
.expl { margin-top: 14px; background: #f8fafc; border: 1px solid var(--line); border-radius: 9px; padding: 14px; }
.expl .lab { font-size: 12px; font-weight: 800; margin-bottom: 4px; }
.expl p { font-size: 12px; color: var(--ink2); line-height: 1.7; }
.exam-submit { display: flex; justify-content: flex-end; margin-top: 18px; }

/* 일정 */
.sch-head { padding: 18px 20px; border-bottom: 1px solid var(--line); font-size: 15px; font-weight: 800; }
.sch-row { padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; }
.sch-row:last-child { border-bottom: none; }
.sch-row .tt { font-size: 13.5px; font-weight: 800; }
.sch-row .dd { font-size: 11.5px; color: var(--ink2); margin-top: 4px; }

/* 현황 */
.res-panel { padding: 22px; }
.res-panel h3 { font-size: 15px; margin-bottom: 14px; }
.res-row { padding: 13px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; border-bottom: 1px solid #f1f5f9; flex-wrap: wrap; }
.res-row:last-child { border-bottom: none; }
.res-row .cat { font-size: 13px; font-weight: 800; }
.res-row .dt { font-size: 11px; color: var(--ink3); margin-top: 3px; }
.res-row .sc { font-size: 13px; font-weight: 800; }
.empty { padding: 30px; text-align: center; color: var(--ink3); font-size: 12.5px; }
</style>
</head>

<body>
<div id="toast"></div>

<!-- 로그인 화면 -->
<div id="login-view" class="login">
  <div class="box">
    <div class="cap">N-FINANCE CORPORATE ACADEMY</div>
    <h1>N금융사업부 설계사 자격시험 연수원</h1>
    <p>생명보험 · 손해보험 · 제3보험 자격취득 온라인 교육 시스템</p>
    <button id="kakao-btn" class="kakao">카카오톡 간편인증 로그인</button>
  </div>
</div>

<!-- 메인 앱 -->
<div id="app-view">
  <header>
    <div class="hwrap">
      <div class="brand">
        <div class="mark">N</div>
        <div>
          <div class="t1">N금융사업부</div>
          <div class="t2">자격시험 연수 시스템</div>
        </div>
      </div>
      <nav>
        <button data-tab="lect" class="on">이론 강의실 (13강)</button>
        <button data-tab="exam">기출 모의고사 (CBT)</button>
        <button data-tab="schedule">시험 일정·접수</button>
        <button data-tab="results">수강·합격 현황</button>
      </nav>
      <div class="huser">
        <span id="progress-line"></span>
        <span>👤</span>
        <b id="user-name"></b>
        <button id="logout-btn" title="로그아웃">⏻</button>
      </div>
    </div>
  </header>

  <main>
    <!-- TAB 1: 이론 강의실 -->
    <div class="tab-pane" data-pane="lect">
      <div class="studio">
        <aside class="panel curr">
          <div class="head">
            <h2>과목별 커리큘럼 (13강)</h2>
            <div class="catbar">
              <button data-cat-course="all" class="on">전체</button>
              <button data-cat-course="life">생보</button>
              <button data-cat-course="property">손보</button>
              <button data-cat-course="third">제3</button>
            </div>
          </div>
          <div class="list" id="curr-list"></div>
        </aside>

        <section class="lecture">
          <div class="panel lect-top">
            <div>
              <div class="sub" id="lect-sub"></div>
              <h2 id="lect-title"></h2>
            </div>
            <div class="parts" id="parts"></div>
          </div>

          <div class="panel stage">
            <div class="slide">
              <div class="meta">
                <span class="chap" id="slide-chap"></span>
                <span class="mini" id="slide-time"></span>
              </div>
              <h3 id="slide-keyword"></h3>
              <p class="sub" id="slide-sub"></p>
              <div class="vcards" id="slide-cards"></div>
              <div class="formula" id="slide-formula"></div>
            </div>
            <div class="presenter">
              <div class="top">
                <div>
                  <span class="studio-lab">N-FINANCE EDU STUDIO</span>
                  <h4>박준호 수석 전문강사</h4>
                </div>
                <span class="state-chip" id="state-chip">일시정지</span>
              </div>
              <div class="avatar-wrap">
                <div class="avatar-ring" id="avatar-ring">
                  <svg viewBox="0 0 120 120">
                    <circle cx="60" cy="42" r="20" fill="#cbd5e1"/>
                    <path d="M22 112 C22 82, 40 70, 60 70 C80 70, 98 82, 98 112 Z" fill="#334155"/>
                    <polygon points="52,70 68,70 60,96" fill="#f8fafc"/>
                    <polygon points="57,76 63,76 64,106 60,112 56,106" fill="#0284c7"/>
                  </svg>
                </div>
                <div class="eq" id="eq"></div>
                <div class="hint" id="pres-hint"></div>
              </div>
              <div class="audio-box">
                <div class="arow">
                  <span class="lab">오디오 출력 상태</span>
                  <button id="mute-btn" class="mute-btn">🔊 음성 켜짐</button>
                </div>
                <div class="arow" style="border-top:1px solid #1e293b;padding-top:12px">
                  <span class="lab">🎚 강의 배속</span>
                  <div class="speed-set">
                    <button data-speed="0.92">0.9x</button>
                    <button data-speed="1.0" class="on">1.0x</button>
                    <button data-speed="1.15">1.15x</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="panel tele">
            <div class="frame">
              <div class="head">
                <span style="font-size:12px;font-weight:800">강의 대본 및 실시간 음성 자막</span>
                <span class="mini">문장을 클릭하면 해당 위치부터 읽어줍니다</span>
              </div>
              <div class="body" id="tele-body"></div>
            </div>
            <div class="ctrls">
              <div class="left">
                <button id="play-btn" class="play-btn accent">▶ <span>음성 강의 재생</span></button>
                <button id="rewind-btn" class="icon-btn" title="현재 파트 처음부터 듣기">⟲</button>
                <button id="prev-part" class="icon-btn" title="이전 파트">‹</button>
                <button id="next-part" class="icon-btn" title="다음 파트">›</button>
              </div>
              <div class="right">
                <button id="copy-btn" class="btn ghost">📋 교안 대본 복사</button>
                <button id="exam-link-btn" class="btn">📄 단원 기출문제 풀기</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <!-- TAB 2: 모의고사 -->
    <div class="tab-pane" data-pane="exam" style="display:none">
      <div class="panel exam-top">
        <div class="exam-cats" id="exam-catbar"></div>
        <div id="exam-actions" style="display:flex;gap:8px"></div>
      </div>
      <div id="exam-list"></div>
      <div class="exam-submit" id="exam-actions-bottom"></div>
    </div>

    <!-- TAB 3: 시험 일정 -->
    <div class="tab-pane" data-pane="schedule" style="display:none">
      <div class="panel">
        <div class="sch-head">생명보험 및 손해보험 협회 자격시험 일정</div>
        <div id="schedule-list"></div>
      </div>

function saveState() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({
      completed: state.completed, history: state.history,
      schedules: state.schedules, courseId: state.courseId, speed: state.speed
    }));
  } catch (e) { /* file:// 제한 등 — 무시 */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (Array.isArray(s.completed)) state.completed = s.completed;
    if (Array.isArray(s.history)) state.history = s.history;
    if (Array.isArray(s.schedules)) state.schedules = s.schedules;
    if (typeof s.courseId === 'string' && ACADEMY_COURSES.some(c => c.id === s.courseId)) state.courseId = s.courseId;
    if (typeof s.speed === 'number') state.speed = s.speed;
  } catch (e) { /* 손상 시 무시 */ }
}

const $ = (sel) => document.querySelector(sel);
let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 3000);

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ── 음성 강의 엔진 (Web Speech API + 폴백 타이머) ── */
let speechTimer = null, speechSafety = null;
const synthSupported = typeof window !== 'undefined' && 'speechSynthesis' in window;
function cancelSpeech() {
  if (synthSupported) window.speechSynthesis.cancel();
  clearTimeout(speechTimer); clearTimeout(speechSafety);
}
function courseById(id) { return ACADEMY_COURSES.find(c => c.id === id) || ACADEMY_COURSES[0]; }
function sentencesOf(scene) {
  return scene.avatarScript.split(/(?<=[.?!])\s+/).map(s => s.trim()).filter(Boolean);
}
function currentCourse() { return courseById(state.courseId); }
function currentScene() { return currentCourse().scenes[state.sceneIdx] || currentCourse().scenes[0]; }

function advanceSentence() {
  const sents = sentencesOf(currentScene());
  if (state.sentIdx < sents.length - 1) {
    state.sentIdx++;
    renderTeleprompter(); renderPresenter(); speakCurrent();
    return;
  }
  // 파트 자동 이동 → 마지막이면 수강 완료
  const course = currentCourse();
  if (state.sceneIdx < course.scenes.length - 1) {
    state.sceneIdx++; state.sentIdx = 0;
    renderSlide(); renderTeleprompter(); renderPresenter(); speakCurrent();
  } else {
    state.isPlaying = false;
    if (!state.completed.includes(course.id)) state.completed.push(course.id);
    saveState();
    toast(course.moduleCode + ' 수강이 완료되었습니다.');
    renderAll();
  }
}
function speakCurrent() {
  const sents = sentencesOf(currentScene());
  const text = sents[state.sentIdx] || '';
  if (!text || !state.isPlaying) return;
  if (!state.muted && synthSupported) {
    try {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR'; u.pitch = 0.92; u.rate = state.speed;
      const voices = window.speechSynthesis.getVoices();
      const kor = voices.filter(v => v.lang.includes('ko') || v.lang.includes('KR'));
      const pick = kor.find(v => /InJoon|Minsu|Male|Online|Natural/i.test(v.name)) || kor[0];
      if (pick) u.voice = pick;
      let finished = false;
      const done = () => {
        if (finished) return;
        finished = true;
        speechTimer = setTimeout(advanceSentence, 350);
      };
      u.onend = done;
      u.onerror = () => {
        if (!finished) { finished = true; speechTimer = setTimeout(advanceSentence, Math.max(2500, text.length * 140)); }
      };
      window.speechSynthesis.speak(u);
      speechSafety = setTimeout(done, Math.max(4000, (text.length * 190) / state.speed));
    } catch (e) {
      speechTimer = setTimeout(advanceSentence, Math.max(3000, text.length * 150));
    }
  } else {
    speechTimer = setTimeout(advanceSentence, Math.max(3000, (text.length * 140) / state.speed));
  }
}
function togglePlay() {
  const next = !state.isPlaying;
  if (!next) cancelSpeech();
  state.isPlaying = next;
  if (next) speakCurrent();
  renderPlayControls(); renderPresenter();
}
function selectScene(idx) {

}

  const qs = state.examCategory === 'all' ? ACADEMY_QUESTIONS : ACADEMY_QUESTIONS.filter(q => q.category === state.examCategory);
  $('#exam-catbar').innerHTML =

    return '<div class="panel q"><div class="head"><span class="mini"><b>제 ' + (idx + 1) + ' 문항</b> · ' + esc(q.subject) + '</span>' +
      (state.submitted ? (correct ? '<span class="pill tag-ok">✔ 정답</span>' : '<span class="pill tag-bad">✘ 오답</span>') : '') + '</div>' +
      '<h3>' + esc(q.question) + '</h3>' +
      q.options.map((opt, oi) => {
        let cls = 'opt';
        if (sel === oi) cls += ' sel';
        if (state.submitted) {
          if (q.correctAnswer === oi) cls = 'opt ans';
          else if (sel === oi) cls = 'opt wrong';
        }
        return '<button class="' + cls + '" data-q="' + q.id + '" data-o="' + oi + '"' + (state.submitted ? ' disabled' : '') + '>' +
          '<span class="no">' + (oi + 1) + '</span><span>' + esc(opt) + '</span></button>';
      }).join('') +
      (state.submitted ? '<div class="expl"><div class="lab">해설 (정답: ' + (q.correctAnswer + 1) + '번)</div><p>' + esc(q.explanation) + '</p></div>' : '') +
      '</div>';
  }).join('');
  $('#exam-actions').innerHTML = state.submitted
    ? '<button class="btn ghost" data-act="reset-exam">답안 초기화 및 재응시</button>'
    : '<button class="btn" data-act="submit-exam">답안 제출 및 채점하기</button>';
}
function renderSchedule() {
  $('#schedule-list').innerHTML = state.schedules.map(s =>
    '<div class="sch-row"><div><div class="tt">' + esc(s.type) + '</div>' +
    '<div class="dd">시험일시: ' + esc(s.date) + ' ' + esc(s.time) + ' · 장소: ' + esc(s.loc) + '</div></div>' +
    '<button class="btn' + (s.applied ? ' ghost' : '') + '" data-applied="' + s.id + '">' +
    (s.applied ? '접수 완료 (취소)' : '응시 접수') + '</button></div>').join('');
}
function renderResults() {
  $('#results-panel').innerHTML = '<h3>모의고사 응시 및 성취도 이력</h3><div>' +
    (state.history.length ? state.history.map(h =>
      '<div class="res-row"><div><div class="cat">' + esc(h.cat) + '</div><div class="dt">' + esc(h.date) + '</div></div>' +
      '<div style="display:flex;gap:12px;align-items:center"><span class="sc">' + h.score + '점</span>' +
      '<span class="pill ' + (h.passed ? 'tag-ok' : 'tag-bad') + '">' + (h.passed ? '합격권' : '재응시 권장') + '</span></div></div>').join('')
    : '<div class="empty">아직 응시 이력이 없습니다.</div>') + '</div>';
}
function renderAll() {
  renderProgress(); renderCurrList(); renderSlide(); renderTeleprompter();
  renderPresenter(); renderPlayControls(); renderExam(); renderSchedule(); renderResults();
  document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === state.activeTab));
  document.querySelectorAll('.tab-pane').forEach(p => { p.style.display = p.dataset.pane === state.activeTab ? '' : 'none'; });
}

/* ── 이벤트 ── */
document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab],[data-cat-course],[data-course],[data-part],[data-sent],[data-speed],[data-xcat],[data-q],[data-applied],[data-act]');
  if (!t) return;
  if (t.dataset.tab) {
    state.activeTab = t.dataset.tab;
    renderAll(); return;
  }
  if (t.dataset.course) { selectCourse(t.dataset.course); return; }
  if (t.dataset.catCourse) {
    state.category = t.dataset.catCourse;
    const first = state.category === 'all' ? ACADEMY_COURSES[0] : ACADEMY_COURSES.find(c => c.category === state.category);
    selectCourse(first.id); return;
  }
  if (t.dataset.part !== undefined && t.dataset.part !== '') { selectScene(parseInt(t.dataset.part, 10)); return; }
  if (t.dataset.sent !== undefined && t.dataset.sent !== '') {
    state.sentIdx = parseInt(t.dataset.sent, 10);
    if (!state.isPlaying) { state.isPlaying = true; speakCurrent(); } else { cancelSpeech(); speakCurrent(); }
    renderTeleprompter(); renderPresenter(); renderPlayControls(); return;
  }
  if (t.dataset.speed) {
    state.speed = parseFloat(t.dataset.speed);
    saveState(); renderPresenter(); return;
  }
  if (t.dataset.xcat) {
    state.examCategory = t.dataset.xcat;
    state.answers = {}; state.submitted = false;
    renderExam(); return;
  }
  if (t.dataset.q && !state.submitted) {
    state.answers[t.dataset.q] = parseInt(t.dataset.o, 10);
    renderExam(); return;
  }
  if (t.dataset.applied) {
    const id = parseInt(t.dataset.applied, 10);
    state.schedules = state.schedules.map(s => s.id === id ? { ...s, applied: !s.applied } : s);
    saveState(); renderSchedule(); toast('시험 접수 상태가 변경되었습니다.'); return;
  }
  if (t.dataset.act === 'submit-exam') {
    const qs = state.examCategory === 'all' ? ACADEMY_QUESTIONS : ACADEMY_QUESTIONS.filter(q => q.category === state.examCategory);
    if (Object.keys(state.answers).length < qs.length) { toast('모든 문항의 답안을 선택해 주십시오.'); return; }
    state.submitted = true;
    let correct = 0;
    qs.forEach(q => { if (state.answers[q.id] === q.correctAnswer) correct++; });
    const score = Math.round((correct / qs.length) * 100);
    state.history.unshift({ date: '2026.10.15', cat: '실전 기출 모의고사', score, passed: score >= 60 });
    saveState(); renderExam(); renderResults(); toast('채점이 완료되었습니다. 취득 점수: ' + score + '점');
    return;
  }
  if (t.dataset.act === 'reset-exam') {
    state.answers = {}; state.submitted = false;
    renderExam(); return;
  }
});

$('#play-btn').addEventListener('click', togglePlay);
$('#rewind-btn').addEventListener('click', () => {
  cancelSpeech(); state.sentIdx = 0; state.isPlaying = true;
  renderTeleprompter(); renderPresenter(); renderPlayControls(); speakCurrent();
});
$('#prev-part').addEventListener('click', () => selectScene(Math.max(0, state.sceneIdx - 1)));
$('#next-part').addEventListener('click', () => selectScene(Math.min(currentCourse().scenes.length - 1, state.sceneIdx + 1)));
$('#mute-btn').addEventListener('click', () => {
  state.muted = !state.muted;
  if (state.isPlaying) { cancelSpeech(); speakCurrent(); }
  renderPresenter();
});
$('#copy-btn').addEventListener('click', () => {
  const c = currentCourse();
  const body = c.scenes.map(s => '[' + s.timeCode + '] ' + s.chapterTitle + '\n핵심요약: ' + s.mainKeyword + '\n대본: ' + s.avatarScript).join('\n\n');
  const text = '# ' + c.moduleCode + ' ' + c.title + '\n\n' + body;
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text);
  toast('현재 강의 전체 대본이 클립보드에 복사되었습니다.');
});
$('#exam-link-btn').addEventListener('click', () => {
  state.isPlaying = false; cancelSpeech();
  state.examCategory = currentCourse().category;
  state.answers = {}; state.submitted = false;
  state.activeTab = 'exam'; renderAll();
});
$('#logout-btn').addEventListener('click', () => {
  cancelSpeech(); state.isPlaying = false;
  state.loggedIn = false; renderAuth();
});
$('#kakao-btn').addEventListener('click', () => { state.loggedIn = true; renderAuth(); });

function renderAuth() {
  if (state.loggedIn) {
    $('#login-view').style.display = 'none';
    $('#app-view').style.display = '';
    renderAll();
  } else {
    $('#app-view').style.display = 'none';
    $('#login-view').style.display = 'flex';
  }
}

/* 초기화 */
loadState();
if (synthSupported) window.speechSynthesis.getVoices();
window.addEventListener('beforeunload', () => cancelSpeech());
renderAuth();
</script>
</body>
</html>
